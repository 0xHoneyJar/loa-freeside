# NOT a human-prose table — automation consumes this file.
# Disposition rubric (FR-0, BUG-FIRST): a conservation/auth/balance assertion is BUG by definition →
# FIX-PLATFORM, NEVER quarantined. STRANDED = a port↔live mid-flight artifact (the .live moved/moving).
# version: 1 · generated: 2026-06-21 (sprint-1 T1) · cycle: extraction-migration
