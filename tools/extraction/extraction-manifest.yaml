    port: packages/core/ports          # platform's own auth (operational/admin), NOT end-user identity
    live_paths: [packages/adapters/security, themes/sietch/src/packages/security]
    destination: STAYS-PLATFORM        # DECIDED (T2) — see decisions[security-mfa-disposition]
    phase: 0
    port_routed: n/a
    status: platform-stays
    decision: security-mfa-disposition  # resolved 2026-06-21 (T2); rationale in decisions: below
  - name: contract-layer              # protocol-conformance, semantic-invariants
    port: packages/core
    live_paths: [packages/core]
    destination: STAYS-PLATFORM        # the ports/contract the federation depends on
    phase: 0
    status: platform-stays

