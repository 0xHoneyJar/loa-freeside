name: Collection Protocol Compat

# CR-005 — identical entrypoint consumers can mirror.
# sonar-api / freeside-dashboard should call the same scripts against a pinned
# artifact (see packages/protocol/collection/CONSUMER.md).

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - 'packages/protocol/collection/**'
      - '.github/workflows/collection-protocol-compat.yml'
  pull_request:
    paths:
      - 'packages/protocol/collection/**'
      - '.github/workflows/collection-protocol-compat.yml'
  workflow_dispatch:

jobs:
  compat:
    name: collection-protocol ci-compat
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/protocol/collection
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.4

      - name: Run CR-005 compatibility harness
        run: ./scripts/ci-compat.sh
