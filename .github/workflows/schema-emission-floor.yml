# cycle-112 schema-emission floor — CI gate.
#
# Ramp complete (FR-ADOPT-8): the facade (S1), lint (S2), generator (S3) and pilot
# (S4) landed first; S5/T5.5 flips the gate to FAIL-BLOCK (--enforce). A NEW raw
# NATS .publish now fails CI; the allowlist may only SHRINK.
#   1. events-lint --enforce   — fails on a NEW (un-allowlisted) raw NATS .publish
#                                / internalPublish leak.
#   2. allowlist shrink-gate --enforce — fails if the allowlist set gains any id.
name: schema-emission-floor

on:
  pull_request:
    paths:
      - "packages/events/**"
      - "packages/adapters/**"
      - "packages/sandbox/**"
      - "apps/worker/**"
      - "tools/check-nats-allowlist-shrinks.sh"
      - ".github/workflows/schema-emission-floor.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the shrink-gate diffs against the base branch
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: events-lint (fail-block)
        run: node packages/events/bin/events-lint.mjs --root . --enforce
      - name: raw-NATS allowlist shrink-gate (fail-block)
        env:
          BASE: ${{ github.event.pull_request.base.ref || 'main' }}
        run: bash tools/check-nats-allowlist-shrinks.sh --enforce
