name: Agent Subsystem CI

on:
  pull_request:
    paths:
      - 'packages/**'
      - 'tests/unit/**'
      - 'tests/integration/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'tests/unit/**'
      - 'tests/integration/**'

concurrency:
  group: agent-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NATS_URL: nats://127.0.0.1:4222
      REDIS_URL: redis://127.0.0.1:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start NATS with JetStream
        run: |
          docker run -d --name nats \
            -p 4222:4222 -p 8222:8222 \
            nats:2 -js -m 8222

      - name: Install redis-cli
        run: sudo apt-get update && sudo apt-get install -y redis-tools

      - name: Verify service connectivity
        run: |
          # Wait for NATS JetStream
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8222/jsz > /dev/null 2>&1; then
              echo "NATS JetStream ready"
              break
            fi
            echo "Waiting for NATS JetStream... ($i/30)"
            sleep 1
          done
          curl -sf http://127.0.0.1:8222/jsz || (echo "NATS JetStream not available" && exit 1)

          # Verify Redis
          redis-cli -h 127.0.0.1 ping || (echo "Redis not available" && exit 1)

      - name: Build core (adapters typecheck depends on @freeside/core/ports)
        run: npm ci --ignore-scripts && npm run build
        working-directory: packages/core

      - name: Install adapters dependencies
        run: npm ci --ignore-scripts
        working-directory: packages/adapters

      - name: Install sietch dependencies (root tests import themes/sietch protocol)
        run: npm ci --ignore-scripts
        working-directory: themes/sietch

      - name: Type check
        run: npm run typecheck
        working-directory: packages/adapters

      - name: Unit tests
        run: ./node_modules/.bin/vitest run --config vitest.agent-ci.config.ts

      - name: Integration tests
        # RC-3 fix: `npx vitest run tests/integration/` without --config scans the entire
        # repo matching the path pattern — collects sietch + worktree files (600+, all failing).
        # vitest.agent-ci-integration.config.ts scopes to tests/integration/**/*.test.ts only.
        run: npx vitest run --config vitest.agent-ci-integration.config.ts
        env:
          REDIS_URL: redis://127.0.0.1:6379
          BERACHAIN_RPC_URLS: https://rpc.test.example.com
          BGT_ADDRESS: '0x0000000000000000000000000000000000000001'
          TRIGGER_PROJECT_ID: test-project-id
          TRIGGER_SECRET_KEY: test-secret-key
          DISCORD_BOT_TOKEN: test-bot-token
          DISCORD_GUILD_ID: test-guild-id
          DISCORD_CHANNEL_THE_DOOR: test-channel-the-door
          DISCORD_CHANNEL_CENSUS: test-channel-census
          DISCORD_ROLE_NAIB: test-role-naib
          DISCORD_ROLE_FEDAYKIN: test-role-fedaykin
          ADMIN_API_KEYS: 'test-key:test-admin'
          API_KEY_PEPPER: test-pepper-value-for-unit-tests-32chars!
          RATE_LIMIT_SALT: test-rate-limit-salt-value
          NODE_ENV: test
          LOG_LEVEL: error
