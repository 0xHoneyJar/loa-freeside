# S2-T2 (SDD §8, IMP-013, G-6) — org-as-code agent gate.
#
# Runs `railway config plan` (READ-ONLY) against .railway/railway.ts and fails the PR on:
#   1. ANY destructive change (baseline-independent) — Railway IaC is declarative and will DELETE
#      resources it does not declare. A plan against a wrongly-linked project once read
#      "1 to add, 3 to DESTROY" (would have deleted ordering-service + its Postgres).
#   2. Drift from the committed .railway/plan-baseline.json — an intended IaC change must refresh the
#      baseline in the same PR, which makes it explicit and reviewable.
#
# This workflow NEVER applies. `railway config apply` stays human-gated (NFR-2).
# Secrets never reach the logs: the gate prints only change kind/severity/summary (variable NAMES, not
# values — Railway redacts values as «hidden»).
#
# ── SECRET-HANDLING (FAGAN review, 2026-07-12) ────────────────────────────────────────────────────────
# RAILWAY_TOKEN is apply-capable, so treat everything in the PR head as untrusted:
#   · The GATE SCRIPT is fetched from the BASE ref, never the PR head — otherwise a PR could edit
#     plan-gate.mjs to exfiltrate the token.
#   · The Railway CLI + SDK are PINNED — `npm install -g @railway/cli` (unpinned) is arbitrary code
#     running with the secret in env.
#   · A same-repo PR with the secret MISSING now FAILS rather than exiting 0 — a gate that silently goes
#     green when unconfigured protects nothing. (Fork PRs legitimately have no secret: GitHub withholds
#     secrets from forks on `pull_request`, so they cannot exfiltrate it — those skip with a warning.)
#
# RESIDUAL RISK (accepted, documented): `railway config plan` EVALUATES .railway/railway.ts — it is a
# TypeScript program. A same-repo PR could put exfiltration code in it. That is not a privilege escalation
# (a same-repo PR author already has repo write), and fork PRs get no secret. If Railway ever ships a
# read-only/plan-scoped token, use it here instead.
#
# SETUP (operator, one-time): add repo secret RAILWAY_TOKEN — a Railway project token scoped to the
# shadow-audit-api project + production environment (Railway → project → Settings → Tokens).

name: railway-plan-gate

on:
  pull_request:
    paths:
      - '.railway/**'
      - 'packages/services/shadow-audit/Dockerfile'
  workflow_dispatch:

jobs:
  plan-gate:
    name: railway config plan (read-only gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need the base ref to fetch the trusted gate script

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # PINNED. Unpinned installs are arbitrary code executing with an apply-capable token in env.
      - name: Install Railway CLI + SDK (pinned)
        run: |
          npm install -g @railway/cli@4.10.0
          npm install --no-save railway@3.5.5

      - name: Fetch the gate script from the BASE ref (never the PR head)
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${{ github.base_ref }}"
          # The PR may legitimately CHANGE .railway/railway.ts (that is what we are reviewing), but the
          # script that runs WITH the token must be the one already on the base branch.
          git show "origin/${{ github.base_ref }}:.railway/plan-gate.mjs" > /tmp/plan-gate.mjs
          git show "origin/${{ github.base_ref }}:.railway/plan-baseline.json" > /tmp/plan-baseline.json || true

      - name: Plan gate (READ-ONLY — never applies)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          IS_SAME_REPO: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${RAILWAY_TOKEN:-}" ]; then
            if [ "${IS_SAME_REPO}" = "true" ]; then
              echo "::error title=railway-plan-gate NOT CONFIGURED::RAILWAY_TOKEN is missing on a same-repo run."
              echo "The destructive/drift gate cannot run, so it must NOT report success."
              echo "Add the repo secret RAILWAY_TOKEN (project token for shadow-audit-api/production)."
              exit 1
            fi
            echo "::warning title=railway-plan-gate skipped::Fork PR — GitHub withholds secrets from forks,"\
                 "so the Railway gate cannot run here. It WILL run on the same-repo merge/branch."
            exit 0
          fi
          # Run the BASE-ref gate script against the PR's .railway/railway.ts.
          script=/tmp/plan-gate.mjs
          [ -f "$script" ] || script=.railway/plan-gate.mjs   # workflow_dispatch: no PR base
          node "$script"
