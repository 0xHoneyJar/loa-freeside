name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # =============================================================================
  # VALIDATE - Check framework files, JSON, versions, links
  # =============================================================================
  validate:
    name: Validate Framework Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Validate JSON files
        run: |
          echo "Validating JSON files..."
          for file in $(find . -name "*.json" -not -path "./node_modules/*" -not -path "./.git/*" -not -path "./.claude/*"); do
            echo "Checking $file"
            python3 -m json.tool "$file" > /dev/null || { echo "Invalid JSON: $file"; exit 1; }
          done
          echo "All JSON files are valid"

      - name: Check skill definitions exist
        run: |
          echo "Checking required skill definitions..."
          SKILLS=(
            ".claude/skills/discovering-requirements/SKILL.md"
            ".claude/skills/designing-architecture/SKILL.md"
            ".claude/skills/planning-sprints/SKILL.md"
            ".claude/skills/implementing-tasks/SKILL.md"
            ".claude/skills/reviewing-code/SKILL.md"
            ".claude/skills/deploying-infrastructure/SKILL.md"
            ".claude/skills/auditing-security/SKILL.md"
            ".claude/skills/translating-for-executives/SKILL.md"
          )
          for skill in "${SKILLS[@]}"; do
            if [ ! -f "$skill" ]; then
              echo "Missing required skill: $skill"
              exit 1
            fi
          done
          echo "All required skills present"

      - name: Check command definitions exist
        run: |
          echo "Checking required command definitions..."
          # Note: setup.md removed in v0.15.0 - no longer required
          COMMANDS=(
            ".claude/commands/plan-and-analyze.md"
            ".claude/commands/architect.md"
            ".claude/commands/sprint-plan.md"
            ".claude/commands/implement.md"
            ".claude/commands/review-sprint.md"
            ".claude/commands/audit-sprint.md"
            ".claude/commands/deploy-production.md"
            ".claude/commands/audit.md"
            ".claude/commands/feedback.md"
            ".claude/commands/update-loa.md"
          )
          for cmd in "${COMMANDS[@]}"; do
            if [ ! -f "$cmd" ]; then
              echo "Missing required command: $cmd"
              exit 1
            fi
          done
          echo "All required commands present"

      - name: Check documentation exists
        run: |
          echo "Checking required documentation..."
          DOCS=(
            "README.md"
            "CLAUDE.md"
            "PROCESS.md"
            "CONTRIBUTING.md"
            "SECURITY.md"
            "CHANGELOG.md"
            "LICENSE.md"
          )
          for doc in "${DOCS[@]}"; do
            if [ ! -f "$doc" ]; then
              echo "Missing required documentation: $doc"
              exit 1
            fi
          done
          echo "All required documentation present"

      - name: Validate version consistency
        run: |
          echo "Checking version consistency..."

          # Get version from CHANGELOG
          CHANGELOG_VERSION=$(grep -oP '## \[\K[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md | head -1)
          echo "CHANGELOG version: $CHANGELOG_VERSION"

          # Get version from README badge
          README_VERSION=$(grep -oP 'version-\K[0-9]+\.[0-9]+\.[0-9]+' README.md | head -1)
          echo "README version: $README_VERSION"

          if [ "$CHANGELOG_VERSION" != "$README_VERSION" ]; then
            echo "Version mismatch: CHANGELOG=$CHANGELOG_VERSION, README=$README_VERSION"
            exit 1
          fi

          echo "Versions are consistent: $CHANGELOG_VERSION"

      - name: Check for broken internal links
        run: |
          echo "Checking for broken internal links in documentation..."

          # Check that referenced files exist
          LINKS_OK=true

          for mdfile in README.md CLAUDE.md PROCESS.md CONTRIBUTING.md; do
            # Extract markdown links like [text](file.md) or [text](./path/file.md)
            grep -oP '\[.*?\]\(\K[^)]+(?=\))' "$mdfile" 2>/dev/null | while read link; do
              # Skip external URLs
              if [[ "$link" == http* ]] || [[ "$link" == "#"* ]]; then
                continue
              fi

              # Check if file exists
              if [ ! -f "$link" ] && [ ! -d "$link" ]; then
                echo "Broken link in $mdfile: $link"
                LINKS_OK=false
              fi
            done
          done

          if [ "$LINKS_OK" = false ]; then
            exit 1
          fi

          echo "All internal links are valid"

  markdown-lint:
    name: Lint Markdown
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli

      - name: Create markdownlint config
        run: |
          cat > .markdownlint.json << 'EOF'
          {
            "default": true,
            "MD013": false,
            "MD033": false,
            "MD041": false,
            "MD024": { "siblings_only": true }
          }
          EOF

      - name: Lint Markdown files
        run: markdownlint '**/*.md' --ignore node_modules --ignore grimoires/loa || true
        # Note: Using || true to not fail on lint warnings for now
        # Remove || true once all markdown is cleaned up

  yaml-lint:
    name: Lint YAML
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint YAML files
        run: yamllint .github/ || true
        # Note: Using || true to not fail on lint warnings for now

  # =============================================================================
  # UNIT TESTS - No external services required
  # =============================================================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: themes/sietch
        run: npm ci

      - name: Static import guard (Redis in unit tests)
        run: bash scripts/check-redis-imports.sh

      - name: Run unit tests
        working-directory: themes/sietch
        run: npm test

  # =============================================================================
  # INTEGRATION TESTS - Requires Redis service container
  # =============================================================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      redis:
        image: redis:7.2@sha256:e422889e156ebea83856b6ff973bfe0c86bce867d80def228044eeecf925592b
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: themes/sietch
        run: npm ci

      - name: Run integration tests
        working-directory: themes/sietch
        run: npm run test:integration
        env:
          REDIS_URL: redis://localhost:6379

  # =============================================================================
  # BEACON SCHEMA dist/ FRESHNESS — refs #233
  # =============================================================================
  # Guards the bug class that triggered the 2026-05-26 BeaconV3 sweep:
  # src/beacon-v3.ts and dist/src/beacon-v3.js drifted because dist/ is
  # gitignored but the V3 rewrite happened only in dist/. Two dispatched
  # agents read stale src and wrote beacons that failed V3 decode.
  #
  # Policy: nothing in packages/beacon-schema/dist/ is ever committed.
  # Fresh `pnpm build` produces dist/ from src/; any committed file in dist/
  # is a sign that src/dist have been allowed to diverge.
  beacon-schema-dist-fresh:
    name: Beacon Schema · dist/ stays generated
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Assert no files are committed under dist/
        run: |
          committed=$(git ls-files packages/beacon-schema/dist/)
          if [ -n "$committed" ]; then
            echo "::error::Files are committed under packages/beacon-schema/dist/ (this directory must stay gitignored)."
            echo ""
            echo "Convention: dist/ is generated output. src/ is the source of truth."
            echo "Fix: run 'git rm --cached -r packages/beacon-schema/dist/' and recommit."
            echo "See https://github.com/0xHoneyJar/loa-freeside/issues/233 for the bug class this guards against."
            echo ""
            echo "Committed dist/ files:"
            printf '  %s\n' $committed
            exit 1
          fi
          echo "OK: no committed files under packages/beacon-schema/dist/"

      - name: Install dependencies
        working-directory: packages/beacon-schema
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: packages/beacon-schema
        run: pnpm build

      - name: Assert build produced no tracked-file changes
        run: |
          # If any file under dist/ becomes tracked (via git add -f) and the
          # committed bytes diverge from a fresh build, `git status` will
          # report it as modified — even though the directory is gitignored.
          # This is the second layer of defense after the ls-files check.
          drift=$(git status --porcelain packages/beacon-schema/dist/)
          if [ -n "$drift" ]; then
            echo "::error::packages/beacon-schema/dist/ diverges from a fresh build."
            echo ""
            echo "Tracked dist/ files that differ from 'pnpm build' output:"
            echo "$drift"
            echo ""
            echo "See https://github.com/0xHoneyJar/loa-freeside/issues/233"
            exit 1
          fi
          echo "OK: fresh build matches working tree"
