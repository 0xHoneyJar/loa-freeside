# Cluster Compliance Workflow — ADR-009 D-13 CI Gate
#
# Validates that every registered cell in loa-freeside/packages/freeside-registry/registry.yaml
# conforms to:
#   - D-13 compliance predicate (auditing-cluster-cells skill checks: substantive mount,
#     default branch=main, CLAUDE.md present, grimoires/loa/NOTES.md present, .beads/,
#     .loa-version.json with framework_version, BeaconV3 manifest at .well-known/beacon.json)
#   - D-9a per-cell capability boundaries (auditing-cell-capabilities skill checks:
#     no secrets, framework-baseline hooks present, no shadowed skills, script-boundary
#     respect, agent-permissions inherits baseline)
#
# Triggers:
#   - PR touching registry.yaml (validates new cells before they land)
#   - PR touching this workflow file (validates the workflow itself)
#   - Nightly cron (catches drift between PRs)
#   - workflow_dispatch (manual operator invocation)
#
# Failure modes:
#   - PR-time: fail check; block merge until cell brought into compliance
#   - Nightly: open an issue on loa-freeside with cluster-status report; tag drifted cells
#   - Manual: surface status; no auto-issue
#
# Authored 2026-05-25 PM per ADR-009 v0.3 D-13 to close flatline finding "CI gate is
# vaporware" (SKP-001 CRIT 850). Companion skills live in construct-freeside.

name: Cluster Compliance

on:
  pull_request:
    paths:
      - 'packages/freeside-registry/registry.yaml'
      - '.github/workflows/cluster-compliance.yml'
  schedule:
    - cron: '0 12 * * *'  # daily at 12:00 UTC
  workflow_dispatch:
    inputs:
      open_issue_on_failure:
        description: 'Open a tracking issue if any cell fails compliance'
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write  # to comment on PR with audit results
  issues: write         # to open tracking issue on nightly failure

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout loa-freeside
        uses: actions/checkout@v4

      # Note: previously checked out construct-freeside for audit scripts,
      # but construct-freeside is PRIVATE so default GITHUB_TOKEN can't access
      # it from this repo. Scripts are now VENDORED into .github/scripts/ from
      # construct-freeside/skills/{auditing-cluster-cells,auditing-cell-capabilities}/resources/
      # (canonical homes; refresh via cluster-meta cycle when scripts evolve).

      - name: Setup yq (Go/mikefarah) + jq + gh
        run: |
          # The roster parse uses `yq -o=json` (mikefarah Go-yq syntax). apt's `yq`
          # is unreliable and the old `|| pip install yq` fallback installs PYTHON-yq,
          # which does NOT accept -o=json — the RED-CI bug (FL T7). Pin the mikefarah
          # Go-yq binary explicitly so the JSON conversion is deterministic.
          YQ_VERSION=v4.44.3
          sudo wget -qO /usr/local/bin/yq "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          sudo chmod +x /usr/local/bin/yq
          # Assert the pinned mikefarah Go-yq is what actually landed — catches a
          # wrong/corrupted binary (FAGAN). FOLLOW-UP for full supply-chain hardening:
          # pin the published SHA256 of yq_linux_amd64 ${YQ_VERSION} and verify it here.
          yq --version | grep -q "mikefarah" || { echo "::error::yq is not the mikefarah Go build"; exit 1; }
          yq --version | grep -q "${YQ_VERSION#v}" || { echo "::error::yq version mismatch (expected ${YQ_VERSION})"; exit 1; }

      - name: Parse cell roster from registry
        id: roster
        run: |
          # Extract cell slug + repo URL pairs from registry.yaml.
          # Registry shape: top-level `modules:` is a MAP keyed by slug (e.g. freeside-sonar).
          # Pipeline: Go-yq converts YAML→JSON, jq processes JSON with full filter language
          # (Go-yq's own query language doesn't support jq-style sub()/capture()/to_entries).
          yq -o=json packages/freeside-registry/registry.yaml | \
            jq -r '.modules | to_entries | .[] |
              "\(.key):\(.value.git_url | sub("https://github.com/"; "") | sub("\\.git$"; ""))"' \
            > cell-list.txt
          echo "Cells found:"
          cat cell-list.txt
          echo "count=$(wc -l < cell-list.txt | tr -d ' ')" >> $GITHUB_OUTPUT

      - name: Audit each cell
        id: audit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p audit-results
          FAILED_CELLS=()
          WARN_CELLS=()
          PASSED_CELLS=()

          while IFS=: read -r slug repo; do
            [ -z "$slug" ] && continue
            echo ""
            echo "═══ Auditing $slug ($repo) ═══"

            # Shallow-clone the cell into a working dir
            CELL_DIR="cell-$slug"
            gh repo clone "$repo" "$CELL_DIR" -- --depth=1 --quiet 2>&1 || {
              echo "  ⚠ Could not clone $repo — skipping"
              echo "{ \"slug\": \"$slug\", \"status\": \"UNREACHABLE\", \"reason\": \"clone failed\" }" \
                > "audit-results/$slug.json"
              WARN_CELLS+=("$slug")
              continue
            }

            # Run existence + topology audit (vendored from construct-freeside auditing-cluster-cells skill)
            EXISTENCE_JSON=$(GITHUB_DIR="$(pwd)" bash .github/scripts/audit-cluster-cells.sh \
              --json --cell "$slug" 2>&1 || echo "{}")

            # Run per-cell capability audit (vendored from construct-freeside auditing-cell-capabilities skill)
            CAPABILITIES_JSON=$(bash .github/scripts/check-cell-capabilities.sh \
              --cell "$CELL_DIR" --json --ci 2>&1 || echo "{}")
            CAP_EXIT=$?

            # Combine results
            jq -n \
              --arg slug "$slug" \
              --argjson existence "$EXISTENCE_JSON" \
              --argjson capabilities "$CAPABILITIES_JSON" \
              '{slug: $slug, existence: $existence, capabilities: $capabilities}' \
              > "audit-results/$slug.json"

            # Classify
            CAP_OVERALL=$(jq -r '.overall // "UNKNOWN"' <<< "$CAPABILITIES_JSON")
            EXISTENCE_DRIFT=$(jq -r '.cells[0].drift_findings // ""' <<< "$EXISTENCE_JSON")

            if [ "$CAP_OVERALL" = "FAIL" ] || [ "$EXISTENCE_DRIFT" != "clean" ]; then
              FAILED_CELLS+=("$slug")
              echo "  ✗ FAIL — capabilities: $CAP_OVERALL, existence-drift: $EXISTENCE_DRIFT"
            else
              PASSED_CELLS+=("$slug")
              echo "  ✓ PASS"
            fi

            # Cleanup clone (free disk)
            rm -rf "$CELL_DIR"
          done < cell-list.txt

          # Summary outputs
          echo "failed_count=${#FAILED_CELLS[@]}" >> $GITHUB_OUTPUT
          echo "passed_count=${#PASSED_CELLS[@]}" >> $GITHUB_OUTPUT
          echo "warn_count=${#WARN_CELLS[@]}" >> $GITHUB_OUTPUT
          echo "failed_cells=${FAILED_CELLS[*]}" >> $GITHUB_OUTPUT

          # Aggregate JSON report. Guard the glob: an empty audit-results/ would
          # otherwise pass the literal string `audit-results/*.json` to jq and crash
          # the job (the RED-CI bug, FL T7). nullglob → an empty array, handled below.
          shopt -s nullglob
          audit_files=(audit-results/*.json)
          if [ ${#audit_files[@]} -eq 0 ]; then
            echo "::warning::no per-cell audit JSON produced — emitting empty aggregate"
            jq -n '{
              audit_ts: (now | strftime("%Y-%m-%dT%H:%M:%SZ")),
              total: 0, failed: [], passed: [], cells: []
            }' > cluster-audit-report.json
          else
            jq -s '{
              audit_ts: now | strftime("%Y-%m-%dT%H:%M:%SZ"),
              total: length,
              failed: [.[] | select(.capabilities.overall == "FAIL" or .existence.cells[0].drift_findings != "clean") | .slug],
              passed: [.[] | select(.capabilities.overall == "PASS" and .existence.cells[0].drift_findings == "clean") | .slug],
              cells: .
            }' "${audit_files[@]}" > cluster-audit-report.json
          fi

          echo ""
          echo "═══ AGGREGATE ═══"
          jq -r '"  total: \(.total) | passed: \(.passed | length) | failed: \(.failed | length)"' cluster-audit-report.json
          jq -r '.failed[] // empty | "  ✗ FAILED: \(.)"' cluster-audit-report.json

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: cluster-audit-report
          path: cluster-audit-report.json
          retention-days: 30

      - name: Render GitHub Summary
        if: always()
        run: |
          {
            echo "## Cluster Compliance — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
            echo "| Metric | Count |"
            echo "|--------|-------|"
            echo "| Total cells | ${{ steps.audit.outputs.passed_count }} pass + ${{ steps.audit.outputs.failed_count }} fail + ${{ steps.audit.outputs.warn_count }} unreachable |"
            echo ""
            if [ "${{ steps.audit.outputs.failed_count }}" -gt 0 ]; then
              echo "### ✗ Failed cells"
              echo "${{ steps.audit.outputs.failed_cells }}" | tr ' ' '\n' | while read cell; do
                [ -n "$cell" ] && echo "- $cell"
              done
            fi
            echo ""
            echo "Full report: see \`cluster-audit-report\` artifact (30-day retention)."
          } >> $GITHUB_STEP_SUMMARY

      - name: Open issue on nightly failure
        if: |
          (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.open_issue_on_failure)) &&
          steps.audit.outputs.failed_count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Cluster compliance drift detected — $(date -u +%Y-%m-%d)" \
            --label "cluster-compliance,drift" \
            --body "$(cat <<EOF
          ## Drift detected by nightly cluster-compliance workflow

          **Failed cells**: ${{ steps.audit.outputs.failed_cells }}

          See the workflow run [here](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) for full details + the \`cluster-audit-report\` artifact.

          Per [ADR-009 D-13](https://github.com/0xHoneyJar/loa-freeside/blob/main/decisions/009-freeside-hexagonal-federation.md), cells that fail compliance get a **30-day remediation window** from when the failure is first reported. After 30 days, cluster-meta dispatch scripts refuse to dispatch agents into the cell.

          To investigate locally (using construct-freeside canonical sources):
          \`\`\`
          bash ~/Documents/GitHub/construct-freeside/skills/auditing-cluster-cells/resources/audit-cells.sh
          bash ~/Documents/GitHub/construct-freeside/skills/auditing-cell-capabilities/resources/check-capabilities.sh --cell <cell-path>
          \`\`\`
          OR (using vendored workflow copies in this repo):
          \`\`\`
          bash .github/scripts/audit-cluster-cells.sh
          bash .github/scripts/check-cell-capabilities.sh --cell <cell-path>
          \`\`\`

          🤖 Auto-opened by \`.github/workflows/cluster-compliance.yml\`
          EOF
          )"

      - name: Fail step on PR-time compliance failure
        if: github.event_name == 'pull_request' && steps.audit.outputs.failed_count != '0'
        run: |
          echo "::error::Cluster compliance failed for: ${{ steps.audit.outputs.failed_cells }}"
          echo "::error::See workflow summary for details."
          exit 1

  # ─── ACVP bindings — REPORT-ONLY (FL-B1 Phase 0) ──────────────────────────
  # Runs the ACVP-binding validator (freeside-cli doctor) across the registry
  # and posts findings to the job summary. It NEVER fails the PR at this phase.
  # The gate flips to fail-block only via the separate named PR
  # `chore(network): acvp-bindings → fail-block` once Tier-A receipts + the dated
  # allowlist are in place (SDD §8 / sprint-400 T8). Wired by sprint-400 T7.
  acvp-bindings:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout loa-freeside
        uses: actions/checkout@v4

      - name: Setup pnpm + Node
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install + build the CLI chain (standalone packages, no workspace)
        run: |
          set -e
          # packages/* are standalone (file: sibling deps, no root workspace
          # lockfile). Install + build in dependency order so each file: sibling
          # is built BEFORE its consumer installs — the consumer's install then
          # copies the freshly-built sibling dist (beacon-schema → registry → cli).
          for pkg in beacon-schema freeside-registry freeside-cli; do
            echo "──────── packages/$pkg ────────"
            pnpm -C "packages/$pkg" install --no-frozen-lockfile
            pnpm -C "packages/$pkg" build
          done

      - name: Run ACVP-binding audit (report-only)
        id: acvp
        run: |
          set +e
          node packages/freeside-cli/dist/bin/freeside-cli.js doctor --acvp > acvp-report.json 2> acvp.err
          doctor_exit=$?
          echo "doctor_exit=$doctor_exit" >> "$GITHUB_OUTPUT"
          # FAGAN iter-2: guarantee a VALID JSON artifact even if doctor crashed —
          # the report-only job stays green AND the crash is surfaced (not silent).
          if ! jq -e . acvp-report.json >/dev/null 2>&1; then
            jq -n --arg err "$(tail -c 2000 acvp.err 2>/dev/null)" --argjson ex "${doctor_exit:-1}" \
              '{doctor_crashed: true, doctor_exit: $ex, summary: {ok:0, warn:0, error:1}, findings: [], stderr: $err}' \
              > acvp-report.json
          fi
          errors=$(jq '[.findings[] | select(.severity=="error")] | length' acvp-report.json 2>/dev/null || echo "?")
          warns=$(jq '[.findings[] | select(.severity=="warn")] | length' acvp-report.json 2>/dev/null || echo "?")
          echo "errors=$errors" >> "$GITHUB_OUTPUT"
          echo "warns=$warns" >> "$GITHUB_OUTPUT"
          # report-only: this step always succeeds regardless of doctor's exit code
          exit 0

      - name: Render ACVP summary
        if: always()
        run: |
          {
            echo "## ACVP bindings — report-only (FL-B1 Phase 0) — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
            echo "**errors:** ${{ steps.acvp.outputs.errors }} · **warns:** ${{ steps.acvp.outputs.warns }} · doctor exit: ${{ steps.acvp.outputs.doctor_exit }}"
            echo ""
            echo "> This job does NOT block the PR. The fail-block flip is a separate named"
            echo "> PR (\`chore(network): acvp-bindings → fail-block\`) once Tier-A receipts +"
            echo "> the dated allowlist land (sprint-400 T8)."
            echo ""
            if [ -f acvp-report.json ]; then
              echo '```json'
              jq '{summary, acvp_and_seal: [.findings[] | select((.check|startswith("acvp_")) or (.check|startswith("sealed_")) or (.check=="compose_unknown_sibling"))]}' acvp-report.json 2>/dev/null | head -200
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload ACVP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acvp-bindings-report
          path: acvp-report.json
          retention-days: 30

      - name: Open issue on nightly ACVP drift
        if: github.event_name == 'schedule' && steps.acvp.outputs.errors != '0' && steps.acvp.outputs.errors != '?'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Ensure labels exist (idempotent) so issue creation never fails on
          # missing repo metadata unrelated to ACVP findings (FAGAN).
          for L in cluster-compliance acvp drift; do gh label create "$L" --force >/dev/null 2>&1 || true; done
          gh issue create \
            --title "ACVP binding drift — $(date -u +%Y-%m-%d)" \
            --label "cluster-compliance,acvp,drift" \
            --body "$(cat <<EOF
          ## ACVP binding drift detected by nightly cluster-compliance

          **error findings**: ${{ steps.acvp.outputs.errors }} · **warn findings**: ${{ steps.acvp.outputs.warns }}

          Run \`freeside-cli doctor --acvp\` locally, or see the \`acvp-bindings-report\`
          artifact on the workflow run [here](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}).

          Un-backed \`acvp_invariant\`s must be backed by a proof receipt OR land a dated entry
          in \`.freeside/acvp-aspirational-allowlist.yaml\` (default-FAIL, SDD §6).

          🤖 Auto-opened by \`.github/workflows/cluster-compliance.yml\` (acvp-bindings job, report-only)
          EOF
          )"
