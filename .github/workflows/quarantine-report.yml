# Quarantine Report — Sprint-1 T4 · FR-1 (active surfacing, NON-required)
#
# Runs the `quarantine` vitest project (the manifest's proven-STRANDED files,
# excluded from the required suite) and posts a digest comment on the PR so the
# quarantined surface stays VISIBLE — quarantine is a holding cell with a light
# on, not a place tests go to be forgotten. This workflow is intentionally NOT a
# required check; the teeth (expiry / owner / signature) live in the required
# `manifest-gate` job in pr-validation.yml.

name: Quarantine Report

on:
  pull_request:
    branches: [main, staging]
    paths:
      - 'themes/sietch/**'
      - 'tools/extraction/**'
      - 'tools/quarantine/**'
      - '.github/workflows/quarantine-report.yml'

permissions:
  contents: read
  pull-requests: write   # post the digest comment

concurrency:
  group: quarantine-report-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  WORKING_DIR: './themes/sietch'

jobs:
  quarantine:
    name: Quarantine (report-only)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      REDIS_URL: redis://localhost:6379
      API_KEY_PEPPER: 'test-pepper-32-char-minimum-value'
      RATE_LIMIT_SALT: 'test-salt-value'
      WEBHOOK_SECRET: 'test-webhook-secret'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: '${{ env.WORKING_DIR }}/package-lock.json'

      - name: Install pyyaml (manifest YAML bridge)
        run: python3 -m pip install --quiet --user pyyaml || pip3 install --quiet pyyaml

      - name: Enumerate the quarantined surface
        run: |
          set -euo pipefail
          node tools/quarantine/sync-vitest.mjs --check || echo "::warning::quarantine sidecar drifted — manifest-gate will fail the PR"
          python3 tools/quarantine/digest.py > /tmp/quarantine-digest.md
          cat /tmp/quarantine-digest.md >> "$GITHUB_STEP_SUMMARY"

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIR }}
        run: npm ci

      - name: Install workspace package dependencies
        run: |
          cd packages/core && npm ci
          cd ../adapters && npm ci

      - name: Run quarantine project (report-only, never fails the PR)
        working-directory: ${{ env.WORKING_DIR }}
        continue-on-error: true
        run: |
          npx vitest run --workspace vitest.workspace.ts --project quarantine 2>&1 | tee /tmp/quarantine-run.log || true

      - name: Post quarantine digest comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '## 🟡 Quarantine Report\n_(digest unavailable)_';
            try { body = fs.readFileSync('/tmp/quarantine-digest.md', 'utf8'); } catch (e) {}
            const marker = '<!-- quarantine-report -->';
            body = marker + '\n' + body;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
