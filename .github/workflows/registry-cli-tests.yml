# Registry + CLI unit suites — the G-4 consumer gate (cadence-ledger, sprint-410 T1.5)
#
# Guards ADR-012 Phase 0: any PR touching the registry schema/data or the CLI
# must keep BOTH suites green — freeside-cli decodes the REAL registry.yaml
# through the shared schema (file: dep), so this lane is the mechanical proof
# that consumers keep decoding (PRD G-4).
#
# Install order is load-bearing (file:-dep stale-copy hazard, proven locally):
#   beacon-schema (build) → freeside-registry (build + test) → freeside-cli
# installs LAST so its file: deps copy the freshly built packages.
name: Registry + CLI Tests

on:
  pull_request:
    paths:
      - "packages/freeside-registry/**"
      - "packages/freeside-cli/**"
      - "packages/beacon-schema/**"
      - ".github/workflows/registry-cli-tests.yml"

jobs:
  registry-cli-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout loa-freeside
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          # loa:shortcut: pure-speed npm cache warmup — does not change npm ci output
          cache: 'npm'
          cache-dependency-path: |
            packages/beacon-schema/package-lock.json
            packages/freeside-registry/package-lock.json
            packages/freeside-cli/package-lock.json

      # Standalone per-package installs (mirrors cluster-compliance — no workspace).
      # npm ci against committed lockfiles: the gate is lockfile-reproducible, so a
      # red/green is attributable to the PR under test, not floating transitive deps
      # (Bridgebuilder CL-410-002).
      - name: "Build beacon-schema (file: dep of registry + cli)"
        working-directory: packages/beacon-schema
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Test freeside-registry
        working-directory: packages/freeside-registry
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test
          npm run build

      # AFTER registry: the file: dep copies the freshly built schema (stale-copy hazard).
      - name: Test freeside-cli (G-4 consumer gate — zero source changes expected here)
        working-directory: packages/freeside-cli
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm test
