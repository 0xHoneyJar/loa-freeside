<!-- @dsCard group="Type" viewport="720x430" name="Two faces, six roles" subtitle="Michroma sets the wordmark and display. Archivo sets everything else, including every numeral." -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:48px;background:var(--fs-surface-base);font-family:var(--fs-font-body);color:var(--fs-ink-primary)}
.row{display:grid;grid-template-columns:120px 1fr auto;align-items:baseline;gap:24px;padding:16px 0;border-bottom:1px solid var(--fs-line-hairline)}
.row:last-child{border-bottom:none}
.tag{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--fs-ink-muted)}
.spec{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--fs-ink-muted);font-variant-numeric:tabular-nums}</style>
</head><body>
<div class="row"><div class="tag">Wordmark</div><div style="font-family:var(--fs-font-display);font-size:20px;letter-spacing:.16em">FREESIDE</div><div class="spec">Michroma 20 / .16</div></div>
<div class="row"><div class="tag">Display</div><div style="font-family:var(--fs-font-display);font-size:44px;letter-spacing:.04em;line-height:1.05">PARADISE</div><div class="spec">Michroma 44 / .04</div></div>
<div class="row"><div class="tag">Title</div><div style="font-size:26px;font-weight:600;letter-spacing:-.01em">Villa Straylight</div><div class="spec">Archivo 26 / 600</div></div>
<div class="row"><div class="tag">Section</div><div style="font-size:15px;font-weight:600">Service pools</div><div class="spec">Archivo 15 / 600</div></div>
<div class="row"><div class="tag">Body</div><div style="font-size:14px;line-height:1.5;color:var(--fs-ink-secondary)">Running beside the incumbent. Divergence is logged.</div><div class="spec">Archivo 14 / 400</div></div>
<div class="row"><div class="tag">Label</div><div style="font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase">Credit line</div><div class="spec">Archivo 11 / 600 / .14</div></div>
</body></html>
