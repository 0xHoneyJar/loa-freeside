<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:48px;background:var(--fs-surface-base);font-family:var(--fs-font-body);color:var(--fs-ink-primary)}
.grid{display:flex;gap:48px;flex-wrap:wrap;align-items:flex-start}
.cell{display:flex;flex-direction:column;align-items:center;gap:16px}
.cell svg{width:28px;height:28px;fill:none;stroke:var(--fs-ink-primary);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.n{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--fs-ink-muted)}
.note{font-size:14px;line-height:1.5;color:var(--fs-ink-secondary);margin-top:48px;padding-top:24px;border-top:1px solid var(--fs-line-hairline)}</style>
</head><body><div class="grid">
<div class="cell"><svg viewBox="0 0 24 24"><path d="M12 2 L13.6 10.4 L22 12 L13.6 13.6 L12 22 L10.4 13.6 L2 12 L10.4 10.4 Z"/></svg><div class="n">Sun</div></div>
<div class="cell"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 6 L15 12 L12 18 L9 12 Z"/></svg><div class="n">Compass</div></div>
<div class="cell"><svg viewBox="0 0 24 24"><circle cx="8" cy="12" r="4"/><path d="M12 12 H21 M18 12 V16 M21 12 V15.5"/></svg><div class="n">Credit</div></div>
<div class="cell"><svg viewBox="0 0 24 24"><path d="M5 6 H19 L12 13 V19 M8 19 H16"/></svg><div class="n">Lounge</div></div>
<div class="cell"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M5.6 18.4l2.1-2.1"/></svg><div class="n">Maintenance</div></div>
</div>
<div class="note">Glyphs are drawn in the one ink and inherit it, like text. An icon is never an accent colour and never sits in a ring, badge, or coin frame — the circular motif was retired.</div>
</body></html>
