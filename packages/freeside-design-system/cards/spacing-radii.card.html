<!-- @dsCard group="Spacing" viewport="720x180" name="Radius & form" subtitle="Square by default — roundness is earned by context" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:24px;background:var(--fs-surface-base);font-family:var(--fs-font-body);color:var(--fs-ink-primary)}
.grid{display:flex;gap:20px;flex-wrap:wrap}.cell{text-align:center}
.box{width:88px;height:64px;background:var(--fs-surface-raised);border:1px solid var(--fs-line-structural)}
.n{font-size:11px;margin-top:8px;font-weight:600}
.h{font-family:var(--fs-font-body);font-size:10px;color:var(--fs-ink-muted);margin-top:2px}</style>
</head><body><div class="grid">
<div class="cell"><div class="box" style="border-radius:0"></div><div class="n">none</div><div class="h">0 · default</div></div>
<div class="cell"><div class="box" style="border-radius:2px"></div><div class="n">sm</div><div class="h">2 · controls</div></div>
<div class="cell"><div class="box" style="border-radius:4px"></div><div class="n">md</div><div class="h">4 · hospitality</div></div>
<div class="cell"><div class="box" style="border-radius:999px"></div><div class="n">pill</div><div class="h">999 · organic</div></div>
</div></body></html>
