<!-- @dsCard group="Brand" viewport="720x300" name="Wordmark" subtitle="The lockup is the only place the axial device appears. Never inline, never in a header." -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:48px;background:var(--fs-surface-base);font-family:var(--fs-font-body);color:var(--fs-ink-primary);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.wm{font-family:var(--fs-font-display);font-size:56px;letter-spacing:.16em;text-indent:.16em}
.axis{display:flex;align-items:center;gap:16px;width:420px}
.axis .r{flex:1;height:1px;background:var(--fs-accent-1)}
.axis .star{color:var(--fs-accent-1);font-size:16px;line-height:1}
.note{font-size:14px;line-height:1.5;color:var(--fs-ink-secondary);max-width:520px;text-align:center;margin-top:24px;padding-top:24px;border-top:1px solid var(--fs-line-hairline)}</style>
</head><body>
<div class="wm">FREESIDE</div>
<div class="axis"><div class="r"></div><div class="star">✦</div><div class="r"></div></div>
<div class="note">Centred, symmetrical, and stacked under the mark — that is the only correct use. The device never runs inline beside other text, never sits in a header or footer, and never separates the wordmark from a company name. Below 200px wide, drop it and keep the wordmark alone.</div>
</body></html>
