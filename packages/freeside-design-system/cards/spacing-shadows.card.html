<!-- @dsCard group="Spacing" viewport="720x200" name="Elevation" subtitle="Mineral tint + hairline first; soft ink-tinted shadow second — no glow in base" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:28px;background:var(--fs-surface-base);font-family:var(--fs-font-body);color:var(--fs-ink-primary)}
.grid{display:flex;gap:28px;flex-wrap:wrap}.cell{text-align:center}
.box{width:120px;height:72px;background:var(--fs-surface-raised);border:1px solid var(--fs-line-hairline)}
.n{font-size:11px;margin-top:12px;font-weight:600}
.h{font-family:var(--fs-font-body);font-size:10px;color:var(--fs-ink-muted);margin-top:2px}</style>
</head><body><div class="grid">
<div class="cell"><div class="box" style="box-shadow:var(--fs-shadow-1)"></div><div class="n">elev-1</div><div class="h">cards, rows</div></div>
<div class="cell"><div class="box" style="box-shadow:var(--fs-shadow-2)"></div><div class="n">elev-2</div><div class="h">popovers, menus</div></div>
<div class="cell"><div class="box" style="box-shadow:var(--fs-shadow-3)"></div><div class="n">elev-3</div><div class="h">modals, overlays</div></div>
</div></body></html>
