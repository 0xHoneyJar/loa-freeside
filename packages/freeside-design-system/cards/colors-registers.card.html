<!-- @dsCard group="Colors" viewport="720x230" name="Registers" subtitle="Light (Paradise) is default; Deep Space (Authority) is earned" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:#b9b6ad;font-family:var(--fs-font-body)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.reg{background:var(--fs-surface-base);border:1px solid var(--fs-line-hairline);padding:18px}
.cap{font-size:10px;text-transform:uppercase;letter-spacing:.18em;color:var(--fs-ink-muted);font-weight:600;margin-bottom:12px}
h3{font-family:var(--fs-font-display);font-size:20px;letter-spacing:.06em;margin:0 0 4px;color:var(--fs-ink-primary)}
p{margin:0;font-size:12px;color:var(--fs-ink-secondary)}
.chips{display:flex;gap:8px;margin-top:14px}
.chip{flex:1;height:34px;border:1px solid var(--fs-line-hairline)}</style>
</head><body><div class="cols">
<div class="reg">
  <div class="cap">Light · Paradise · default</div>
  <h3>FREESIDE</h3><p>Deep Space Ink on Lado Sunlight.</p>
  <div class="chips"><div class="chip" style="background:var(--fs-surface-base)"></div><div class="chip" style="background:var(--fs-surface-raised)"></div><div class="chip" style="background:var(--fs-surface-sunk)"></div><div class="chip" style="background:var(--fs-accent-authority)"></div></div>
</div>
<div class="reg" data-register="deep-space" style="background:var(--fs-surface-base)">
  <div class="cap">Deep Space · Authority</div>
  <h3>FREESIDE</h3><p>Lado Sunlight on Deep Space Ink.</p>
  <div class="chips"><div class="chip" style="background:var(--fs-surface-base)"></div><div class="chip" style="background:var(--fs-surface-raised)"></div><div class="chip" style="background:var(--fs-surface-sunk)"></div><div class="chip" style="background:var(--fs-accent-authority)"></div></div>
</div>
</div></body></html>
