  <script>

document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Archivo';\n  font-style: normal;\n  font-weight: 500;\n  font-stretch: normal;\n  font-display: swap;\n  src: url(\"c7c1b14c-3c3a-419b-9b10-efea6aeadcb5\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Archivo';\n  font-style: normal;\n  font-weight: 500;\n  font-stretch: normal;\n  font-display: swap;\n  src: url(\"a1beaf8b-cdfe-46ca-b9be-3090d13e224f\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Archivo';\n  font-style: normal;\n  font-weight: 600;\n  font-stretch: normal;\n  font-display: swap;\n  src: url(\"0a2fef10-2448-44ef-821b-e3cf893d62e2\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Archivo';\n  font-style: normal;\n  font-weight: 600;\n  font-stretch: normal;\n  font-display: swap;\n  src: url(\"cebb262e-a21b-4daf-b34f-371dd6e55eaa\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Archivo';\n  font-style: normal;\n  font-weight: 600;\n  font-stretch: normal;\n  font-display: swap;\n  src: url(\"3d0f72dd-67db-4045-9e99-41825c692609\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Archivo';\n  font-style: normal;\n  font-weight: 700;\n  font-stretch: normal;\n  font-display: swap;\n  src: url(\"901d1f8c-4b54-4aad-86bb-d12f0a64e64f\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Archivo';\n  font-style: normal;\n  font-weight: 700;\n  font-stretch: normal;\n  font-display: swap;\n  src: url(\"490b4778-bffd-4f91-976c-5ed2b8f001e7\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Archivo';\n  font-style: normal;\n  font-weight: 700;\n  font-stretch: normal;\n  font-display: swap;\n  src: url(\"f9e86bf1-d59d-411a-8e0a-3a3db0ee00e8\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Archivo Narrow';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"8f7b5f2c-6183-4872-b9d7-33fb09967aef\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Archivo Narrow';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"edd5347c-c5a3-4e23-ae63-d92e0bdc5b32\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Archivo Narrow';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"b5673932-eee9-4bd7-a824-3d5766912b95\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Archivo Narrow';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"a76a46c3-1ac7-45d9-95a8-bed2d1758f56\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Archivo Narrow';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"a0154849-5ed5-4746-8b98-daae089b5408\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Archivo Narrow';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"73bf9fc0-4079-467d-8cf1-0e47199874c6\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Michroma';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"09f929de-e5ad-432e-a626-6e8f6c62d776\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Michroma';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"b120061a-3703-460d-994c-f40255f07526\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n/* Freeside — COLOR. Deep Space is the default; light is the exception.\n\n   TWO RULES, AND THEY ARE THE WHOLE SYSTEM\n   1. TEXT IS ONE INK. Deep Space Ink on light, Lado Sunlight on deep. Colour is\n      never a letterform — it is a bar, a dot, a rule, or a fill behind one ink.\n   2. TWO ACCENTS ON SCREEN. A surface picks ONE pair. Components read only\n      --fs-accent-1 and --fs-accent-2 and never reach past them into the palette.\n      Twelve named colours exist; two are visible at a time. That is what makes\n      an accent an accent.\n\n   Status is not an accent. Positive / caution / critical are functional, appear\n   as a dot or a 3px bar only, and never more than one per row.\n\n   CAUTION — a custom-property alias resolves at its DECLARATION site. Any *-ink\n   alias must be REDECLARED inside a register block even when the expression is\n   identical, or it inherits the other register's frozen literal. */\n:root{\n  /* ═══ Layer 1 · PRIMITIVES — the fixed palette ═══ */\n  --fs-deep-space-ink:#081F28;  /* the void; THE ink on light */\n  --fs-lado-sunlight:#F7F1E5;   /* artificial sun; THE ink on deep */\n  --fs-lunar-concrete:#C1BCB3;\n  --fs-cannes-sky:#66ADC6;\n  --fs-babylon-foliage:#6E7A56;\n  --fs-organic-sand:#CEBA99;\n  --fs-cold-mist:#D1D9DB;\n  --fs-brick:#936064;\n  --fs-casino-magenta:#E1588E;\n  --fs-teal:#58988B;\n  --fs-bermuda-sunset:#C8705B;  /* the signature */\n  --fs-hazard:#F7D481;\n  --fs-babylon-deep:#5C6647;    /* foliage darkened for accent duty — 5.42 with sunlight */\n  --fs-cold-mist-light:#E7ECEE;\n  --fs-ink-2:#2C3E47; --fs-ink-3:#6B6862;\n  --fs-critical:#B23A2E;\n\n  /* ═══ Layer 2 · DEEP SPACE — the default register ═══ */\n  --fs-surface-base:#081F28;\n  --fs-surface-raised:#0E2A34;\n  --fs-surface-sunk:#04141B;\n  --fs-surface-deep:#081F28;\n  --fs-ink-primary:var(--fs-lado-sunlight);\n  --fs-ink-secondary:var(--fs-cold-mist);\n  --fs-ink-muted:#8B979D;  /* AA on raised (5.01) and base (5.67) — the label role lives here */\n  --fs-line-hairline:rgba(247,241,229,.13);\n  --fs-line-structural:#22323A;\n  /* Ink on a solid accent-1 fill. Belongs to the PAIR, not the register — see the\n     [data-accent] blocks. Deep Space Ink is correct for 6 of 8 palette colours. */\n  --fs-on-accent:var(--fs-deep-space-ink);\n\n  /* ═══ Layer 3 · THE ACCENT PAIR — resort, the default ═══ */\n  --fs-accent-1:var(--fs-bermuda-sunset);\n  --fs-accent-2:var(--fs-cannes-sky);\n\n  /* Status — dot or bar only */\n  --fs-state-positive:var(--fs-babylon-foliage);\n  --fs-state-caution:var(--fs-hazard);\n  --fs-state-critical:var(--fs-critical);\n  --fs-state-neutral:#3A4B54;\n\n  /* Status FILLS — the same states, dark enough to carry small text on top.\n     The --fs-state-* values above are dot-or-bar only, exactly as that comment\n     says: Babylon Foliage is 3.70:1 on Deep Space, which is legal behind a dot\n     and illegal behind an 11px label. Reach for these the moment a status\n     becomes a filled pill, and use the paired ink. Absolute values, declared\n     once — a dark pill with light ink is correct on sand and on ink alike, so\n     these deliberately do not vary by register. */\n  --fs-state-positive-fill:#5C6647;                     /* babylon deep — 5.26 with sunlight */\n  --fs-state-positive-fill-ink:var(--fs-lado-sunlight);\n  --fs-state-caution-fill:#7A5E1C;                      /* hazard darkened — 7.29 */\n  --fs-state-caution-fill-ink:var(--fs-lado-sunlight);\n  --fs-state-critical-fill:var(--fs-critical);          /* 5.28 with sunlight */\n  --fs-state-critical-fill-ink:var(--fs-lado-sunlight);\n\n  /* Legacy aliases — old component code keeps working and inherits the pair rule. */\n  --fs-accent-authority:var(--fs-accent-1);\n  --fs-accent-sky:var(--fs-accent-2);\n  --fs-accent-foliage:var(--fs-accent-2);\n  --fs-accent-authority-ink:var(--fs-ink-primary);\n  --fs-accent-sky-ink:var(--fs-ink-primary);\n  --fs-accent-foliage-ink:var(--fs-ink-primary);\n  --fs-state-positive-ink:var(--fs-ink-primary);\n  --fs-state-info:var(--fs-accent-2);\n  --fs-state-info-ink:var(--fs-ink-primary);\n  --fs-state-caution-ink:var(--fs-ink-primary);\n  --fs-state-critical-ink:var(--fs-ink-primary);\n  --fs-state-neutral-ink:var(--fs-ink-muted);\n  --fs-elev-1:var(--fs-shadow-1); --fs-elev-2:var(--fs-shadow-2); --fs-elev-3:var(--fs-shadow-3);\n}\n\n/* ═══ Light (Paradise) — the exception, opted into ═══ */\n[data-register=\"light\"]{\n  --fs-surface-base:var(--fs-lado-sunlight);\n  --fs-surface-raised:#FFFDF8;\n  --fs-surface-sunk:var(--fs-cold-mist-light);\n  --fs-surface-deep:var(--fs-deep-space-ink);\n  --fs-ink-primary:var(--fs-deep-space-ink);\n  --fs-ink-secondary:var(--fs-ink-2);\n  --fs-ink-muted:var(--fs-ink-3);\n  --fs-line-hairline:rgba(8,31,40,.14);\n  --fs-line-structural:#D9D3C7;\n  --fs-state-neutral:var(--fs-lunar-concrete);\n  /* redeclared — see CAUTION above */\n  --fs-accent-authority-ink:var(--fs-ink-primary);\n  --fs-accent-sky-ink:var(--fs-ink-primary);\n  --fs-accent-foliage-ink:var(--fs-ink-primary);\n  --fs-state-positive-ink:var(--fs-ink-primary);\n  --fs-state-info-ink:var(--fs-ink-primary);\n  --fs-state-caution-ink:var(--fs-ink-primary);\n  --fs-state-critical-ink:var(--fs-ink-primary);\n  --fs-state-neutral-ink:var(--fs-ink-muted);\n}\n\n/* ═══ Deep Space as an explicit register ═══\n   :root is already Deep Space, so this block is redundant at the top level and\n   deliberately so: it exists to let a subtree re-enter Deep Space from inside a\n   light one. Without it there is no selector that reverses [data-register=\"light\"],\n   and a Service panel nested in an Atrium page has to hardcode hex literals.\n   Registers now nest in both directions. Values mirror :root exactly — if you\n   change one, change both. The *-ink aliases are redeclared for the reason in\n   the CAUTION above. */\n[data-register=\"deep\"]{\n  --fs-surface-base:#081F28;\n  --fs-surface-raised:#0E2A34;\n  --fs-surface-sunk:#04141B;\n  --fs-surface-deep:#081F28;\n  --fs-ink-primary:var(--fs-lado-sunlight);\n  --fs-ink-secondary:var(--fs-cold-mist);\n  --fs-ink-muted:#8B979D;\n  --fs-line-hairline:rgba(247,241,229,.13);\n  --fs-line-structural:#22323A;\n  --fs-state-neutral:#3A4B54;\n  --fs-shadow-1:none;\n  --fs-shadow-2:0 4px 16px rgba(0,0,0,.35);\n  --fs-shadow-3:0 12px 40px rgba(0,0,0,.45);\n  /* redeclared — see CAUTION above */\n  --fs-accent-authority-ink:var(--fs-ink-primary);\n  --fs-accent-sky-ink:var(--fs-ink-primary);\n  --fs-accent-foliage-ink:var(--fs-ink-primary);\n  --fs-state-positive-ink:var(--fs-ink-primary);\n  --fs-state-info-ink:var(--fs-ink-primary);\n  --fs-state-caution-ink:var(--fs-ink-primary);\n  --fs-state-critical-ink:var(--fs-ink-primary);\n  --fs-state-neutral-ink:var(--fs-ink-muted);\n}\n\n/* ═══ Accent pairs — a surface picks exactly one ═══\n   Each pair carries its own --fs-on-accent, because the readable ink on a solid\n   fill is a property of the colour, not of the register. Measured against\n   accent-1; accent-2 is bars and dots only and never takes a text fill. */\n[data-accent=\"resort\"] { --fs-accent-1:var(--fs-bermuda-sunset);  --fs-accent-2:var(--fs-cannes-sky);   --fs-on-accent:var(--fs-deep-space-ink); } /* 4.79 */\n[data-accent=\"garden\"] { --fs-accent-1:var(--fs-babylon-deep);    --fs-accent-2:var(--fs-organic-sand); --fs-on-accent:var(--fs-lado-sunlight); }  /* 5.42 */\n[data-accent=\"vice\"]   { --fs-accent-1:var(--fs-casino-magenta);  --fs-accent-2:var(--fs-hazard);       --fs-on-accent:var(--fs-deep-space-ink); } /* 4.84 */\n[data-accent=\"systems\"]{ --fs-accent-1:var(--fs-teal);            --fs-accent-2:var(--fs-cannes-sky);   --fs-on-accent:var(--fs-deep-space-ink); } /* 5.08 */\n[data-accent=\"dynasty\"]{ --fs-accent-1:var(--fs-brick);           --fs-accent-2:var(--fs-organic-sand); --fs-on-accent:var(--fs-lado-sunlight); }  /* 4.56 */\n\n/* Freeside — TYPOGRAPHY. Two faces, six roles, one size each.\n   If a piece of text is not one of these six roles, it does not belong on the page.\n\n   ROLE LADDER (largest visual weight to least):\n     wordmark  Michroma caps    — the mark itself. One per screen.\n     display   Michroma caps    — hero numerals/statements. Rare.\n     title     Archivo 600      — the name of the screen. One per screen.\n     section   Archivo 600      — the name of a box.\n     body      Archivo 400      — sentences.\n     label     Archivo 600 caps — the name of a field or column.\n\n   CASING IS A RULE, NOT A CHOICE:\n     wordmark / display / label  → UPPERCASE, always.\n     title / section / body      → Sentence case, always.\n     Title Case is never used anywhere in Freeside. */\n:root{\n  --fs-font-display:'Michroma','Eurostile',sans-serif;\n  --fs-font-body:'Archivo','Helvetica Neue',system-ui,sans-serif;\n  --fs-font-narrow:'Archivo Narrow','Archivo',system-ui,sans-serif; /* dense tables only */\n  --fs-font-code:ui-monospace,'SF Mono',Menlo,monospace;            /* literal code only */\n\n  /* Legacy role aliases — every retired face now resolves to the two real ones,\n     so existing components collapse to the 2-font system with no edits. */\n  --fs-font-heading:var(--fs-font-body);\n  --fs-font-wayfind:var(--fs-font-body);\n  --fs-font-ops:var(--fs-font-body);\n  --fs-font-mono:var(--fs-font-body);   /* numerals are Archivo tabular, not a mono face */\n  --fs-font-elite:var(--fs-font-display);\n  --fs-font-jp:var(--fs-font-body);\n  --fs-font-vice:var(--fs-font-display);\n\n  /* ── Six roles. Size / weight / tracking / leading are fixed per role. ── */\n  --fs-wordmark-size:20px;   --fs-wordmark-track:.16em;  --fs-wordmark-lh:1; /* @kind other */\n  --fs-display-size:44px;    --fs-display-track:.04em;   --fs-display-lh:1.05; /* @kind other */\n  --fs-title-size:26px;      --fs-title-weight:600;      --fs-title-track:-.01em; --fs-title-lh:1.15; /* @kind other */\n  --fs-section-size:15px;    --fs-section-weight:600;    --fs-section-track:0; /* @kind other */\n  --fs-section-lh:1.3; /* @kind other */\n  --fs-body-size:14px;       --fs-body-weight:400;       --fs-body-lh:1.5; /* @kind other */\n  --fs-label-size:11px;      --fs-label-weight:600;      --fs-label-track:.14em;  --fs-label-lh:1; /* @kind other */\n\n  /* Numerals — Archivo tabular. Two sizes: a stat and a cell. Nothing between. */\n  --fs-data-lg:26px; --fs-data-sm:14px;\n  --fs-numeric:tabular-nums; /* @kind other */\n\n  /* Retained ramp for component internals. Layout never reads these. */\n  --fs-size-2xs:11px; --fs-size-xs:12px; --fs-size-sm:14px; --fs-size-base:15px;\n  --fs-size-md:17px;  --fs-size-lg:20px; --fs-size-xl:26px; --fs-size-2xl:32px;\n  --fs-size-3xl:44px; --fs-size-4xl:56px; --fs-size-5xl:72px;\n\n  --fs-leading-tight:1.05; --fs-leading-snug:1.2; --fs-leading-normal:1.5;\n  --fs-tracking-wordmark:.16em; --fs-tracking-label:.14em; --fs-tracking-normal:0;\n  --fs-weight-body:400; --fs-weight-medium:500; --fs-weight-semibold:600; --fs-weight-bold:700;\n}\n\n/* Freeside — SPACE / FORM / ELEVATION / MOTION.\n\n   LAYOUT USES FOUR NUMBERS. 8 / 16 / 24 / 48. Nothing else positions a box.\n     8   inside a control, between a dot and its label\n     16  inside a box, between stacked rows\n     24  between boxes — THE gutter, in both axes, always\n     48  page margin, and the gap between major sections\n   Boxes never touch. If two boxes share an edge, the gutter is missing. */\n:root{\n  --fs-gap-tight:8px;   /* @kind spacing */\n  --fs-gap:16px;        /* @kind spacing */\n  --fs-gutter:24px;     /* @kind spacing */\n  --fs-margin:48px;     /* @kind spacing */\n\n  /* Box padding is derived, not chosen: 24 in a panel, 16 in a dense cell. */\n  --fs-pad-box:24px;    /* @kind spacing */\n  --fs-pad-cell:16px;   /* @kind spacing */\n\n  /* Micro-scale for component internals. Layout must not read these. */\n  --fs-space-0:0;    --fs-space-1:4px;  --fs-space-2:8px;   --fs-space-3:12px;\n  --fs-space-4:16px; --fs-space-6:24px; --fs-space-8:32px;  --fs-space-12:48px;\n  --fs-space-16:64px;--fs-space-24:96px;\n  /* retired odd steps, aliased so nothing breaks */\n  --fs-space-5:var(--fs-space-4); --fs-space-10:var(--fs-space-8);\n  --fs-space-20:var(--fs-space-16); --fs-space-32:var(--fs-space-24);\n\n  /* Radius — square is the default; roundness is earned */\n  --fs-radius-none:0; --fs-radius-sm:2px; --fs-radius-md:4px; --fs-radius-pill:999px;\n\n  --fs-border-w:1px; --fs-accent-bar-w:3px;\n\n  /* Elevation — on deep space, elevation is a lighter surface, not a shadow */\n  --fs-shadow-1:none;\n  --fs-shadow-2:0 4px 16px rgba(0,0,0,.35);\n  --fs-shadow-3:0 12px 40px rgba(0,0,0,.45);\n\n  --fs-ease-standard:cubic-bezier(0.2,0,0,1); /* @kind other */\n  --fs-ease-exit:cubic-bezier(0.4,0,1,1); /* @kind other */\n  --fs-dur-fast:160ms; /* @kind other */\n  --fs-dur-base:240ms; /* @kind other */\n  --fs-dur-slow:420ms; /* @kind other */\n  --fs-dur-signature:1200ms; /* @kind other */\n\n  --fs-lado-sky:linear-gradient(180deg,#66ADC6 0%,#B4DAE4 42%,#F7F1E5 78%,#FFFFFF 100%); /* @kind color */\n\n  --fs-z-base:0; /* @kind other */\n  --fs-z-nav:100; /* @kind other */\n  --fs-z-overlay:400; /* @kind other */\n  --fs-z-modal:500; /* @kind other */\n  --fs-z-toast:700; /* @kind other */\n\n  --fs-page-pad:48px; --fs-band-pad:48px; --fs-panel-pad:24px; --fs-card-pad:24px; --fs-tile-pad:16px;\n\n  /* Exposure rhythm — see Doctrine 01. Rhythm is one of the seven levers, so it\n     is scoped to exposure rather than chosen per page. A page sets\n     data-exposure once at its root and every child reads these two. */\n  --fs-pad-page:48px;   /* @kind spacing */\n  --fs-gap-stack:24px;  /* @kind spacing */\n}\n[data-exposure=\"0\"]{ --fs-pad-page:48px; --fs-gap-stack:24px; }\n[data-exposure=\"1\"]{ --fs-pad-page:48px; --fs-gap-stack:24px; }\n[data-exposure=\"2\"]{ --fs-pad-page:24px; --fs-gap-stack:16px; }\n[data-exposure=\"3\"]{ --fs-pad-page:24px; --fs-gap-stack:8px;\n}\n[data-register=\"light\"]{ --fs-shadow-1:0 1px 2px rgba(8,31,40,.06); --fs-shadow-2:0 4px 16px rgba(8,31,40,.08); --fs-shadow-3:0 12px 40px rgba(8,31,40,.12); }\n\n<\u002Fstyle>\n\n<script src=\"cd728d19-f823-4fd0-96bf-0aafa846576b\"><\u002Fscript>\n<script src=\"12e24e87-1a9b-4065-a38f-eea3dd24cfd8\"><\u002Fscript>\n<script src=\"839ec13c-bde6-441e-aff9-7afe9e0f8616\"><\u002Fscript>\n<script src=\"9e21a57a-6a78-415b-b2e7-00649632ebda\"><\u002Fscript>\n<script src=\"a8ba87b6-bb43-4ba2-8a32-e22834693ffe\"><\u002Fscript>\n<script src=\"31389087-0232-4f7f-a482-615c1f99a1c5\"><\u002Fscript>\n<script src=\"9a85c740-ccf7-4ccf-a2a9-5b58766e4e62\"><\u002Fscript>\n<script src=\"13085e32-f488-4ae1-967f-1e59e4b1556b\"><\u002Fscript>\n<script src=\"fcad3583-eb55-485c-aae5-4884ec917a6e\"><\u002Fscript>\n<style>\n*{box-sizing:border-box;margin:0;padding:0}\nbody{width:1280px;background:var(--fs-surface-base);color:var(--fs-ink-primary);font-family:var(--fs-font-body);font-size:var(--fs-body-size);line-height:var(--fs-body-lh);font-variant-numeric:var(--fs-numeric);padding:48px}\na{color:var(--fs-accent-2)}a:hover{color:var(--fs-accent-1)}\n.lab{font-size:var(--fs-label-size);font-weight:var(--fs-label-weight);letter-spacing:var(--fs-label-track);text-transform:uppercase;color:var(--fs-ink-muted)}\n.title{font-size:var(--fs-title-size);font-weight:var(--fs-title-weight);letter-spacing:var(--fs-title-track);line-height:var(--fs-title-lh)}\n.sec{font-size:var(--fs-section-size);font-weight:var(--fs-section-weight)}\n.stack-8{display:flex;flex-direction:column;gap:8px}\n.stack-16{display:flex;flex-direction:column;gap:16px}\n.stack-24{display:flex;flex-direction:column;gap:24px}\n.stack-48{display:flex;flex-direction:column;gap:48px}\np{max-width:80ch;text-wrap:pretty;color:var(--fs-ink-secondary)}\n.rule{height:1px;background:var(--fs-line-hairline)}\n.panel{background:var(--fs-surface-raised);padding:24px;display:flex;flex-direction:column;gap:16px}\n.check{display:grid;grid-template-columns:24px 1fr auto;gap:16px;align-items:start;padding:16px;background:var(--fs-surface-raised)}\n.check s{width:12px;height:12px;margin-top:5px;text-decoration:none;display:block}\n.ok s{background:var(--fs-state-positive)}\n.bad s{background:var(--fs-state-critical)}\n.verdict{font-size:var(--fs-label-size);font-weight:var(--fs-label-weight);letter-spacing:var(--fs-label-track);text-transform:uppercase;padding:4px 8px;white-space:nowrap}\n/* Filled pills carry 11px text, so they use the *-fill tokens. --fs-state-positive\n   is dot-or-bar only: foliage behind small text measures 3.70:1. */\n.ok .verdict{background:var(--fs-state-positive-fill);color:var(--fs-state-positive-fill-ink)}\n.bad .verdict{background:var(--fs-state-critical-fill);color:var(--fs-state-critical-fill-ink)}\n.fail{font-size:var(--fs-size-xs);color:var(--fs-state-critical);padding-top:4px;line-height:1.5}\ntable{width:100%;border-collapse:collapse}\nth{text-align:left;font-size:var(--fs-label-size);font-weight:var(--fs-label-weight);letter-spacing:var(--fs-label-track);text-transform:uppercase;color:var(--fs-ink-muted);padding:0 16px 8px 0;white-space:nowrap}\ntd{padding:8px 16px 8px 0;border-top:1px solid var(--fs-line-hairline);white-space:nowrap;font-size:var(--fs-size-xs)}\n.m{display:inline-block;padding:2px 8px;font-size:var(--fs-label-size);font-weight:var(--fs-label-weight);letter-spacing:var(--fs-label-track);text-transform:uppercase}\n.m-silent{background:var(--fs-state-critical-fill);color:var(--fs-state-critical-fill-ink)}\n.m-abstract{background:var(--fs-state-caution-fill);color:var(--fs-state-caution-fill-ink)}\n.m-explicit{background:var(--fs-accent-2);color:var(--fs-deep-space-ink)}\n.m-none{color:var(--fs-ink-muted);border:1px solid var(--fs-line-structural)}\n.hero{display:grid;grid-template-columns:1fr auto;gap:48px;align-items:end}\n.big{font-family:var(--fs-font-display);font-size:var(--fs-display-size);line-height:1}\n.g2{display:grid;grid-template-columns:1fr 1fr;gap:24px}\n.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}\n.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}\n.tag{display:inline-block;padding:2px 8px;font-size:var(--fs-label-size);font-weight:var(--fs-label-weight);letter-spacing:var(--fs-label-track);text-transform:uppercase;border:1px solid var(--fs-line-structural);color:var(--fs-ink-muted)}\n/* Axis tags that carry an accent are FILLED, not tinted text. --fs-state-critical\n   and the accents carry the same dot-or-bar-only contract as --fs-state-positive:\n   #B23A2E as 11px text on raised measures 2.53:1, and swapping the ink does not\n   save it. Same rule that produced the *-fill tokens, one section later. */\n.tag-doctrine{background:var(--fs-state-positive-fill);border-color:var(--fs-state-positive-fill);color:var(--fs-state-positive-fill-ink)}\n.tag-sensitive{background:var(--fs-state-critical-fill);border-color:var(--fs-state-critical-fill);color:var(--fs-state-critical-fill-ink)}\ncode{font-family:var(--fs-font-body);color:var(--fs-ink-primary)}\n<\u002Fstyle>\n<\u002Fhead>\n<body data-accent=\"systems\" data-screen-label=\"Doctrine conformance\">\n<div class=\"stack-48\">\n\n<div class=\"hero\">\n<div class=\"stack-16\">\n<span class=\"lab\">Doctrine 01 · Conformance<\u002Fspan>\n<h1 class=\"title\">Every pack, every case<\u002Fh1>\n<p>The doctrine is executable, and split three ways: <code>_doctrine/doctrine.js<\u002Fcode> is the engine, <code>_doctrine/fixtures.js<\u002Fcode> is the case matrix, <code>_doctrine/tests.js<\u002Fcode> holds the assertions. Each template ships its own copy pack and may add its own checks. This card is a <em>renderer for those tests<\u002Fem>, not a second harness — <code>node templates/_doctrine/run-checks.js<\u002Fcode> loads the same four files and prints the same results, exiting non-zero on any failure.<\u002Fp>\n<div style=\"border-left:3px solid var(--fs-state-critical);padding:16px 16px 16px 20px;background:var(--fs-surface-raised);max-width:80ch\">\n<div class=\"sec\" style=\"margin-bottom:8px\">This is a presentation doctrine, not the security boundary<\u002Fdiv>\n<p style=\"font-size:var(--fs-size-xs);margin:0\">Everything asserted here decides what a permitted viewer is <em>shown<\u002Fem>. It does not decide what they are permitted to <em>receive<\u002Fem>. Unauthorized rows, cells, counts, pagination metadata and exports must be filtered or authorized <strong style=\"color:var(--fs-ink-primary)\">server-side, before the payload reaches the client<\u002Fstrong>. Omitting a node from the DOM, dropping a column, and hiding an element with CSS are not access control — the data is still in the response, and the response is readable. A green verdict means the screen states the right amount; it says nothing about what was sent.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"stack-8\" style=\"text-align:right\">\n<span class=\"lab\">Verdict<\u002Fspan>\n<div class=\"big\" id=\"verdict\">—<\u002Fdiv>\n<span class=\"lab\" id=\"scope\"><\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"stack-16\" id=\"checks\"><\u002Fdiv>\n\n<div class=\"rule\"><\u002Fdiv>\n\n<div class=\"stack-24\">\n<div class=\"stack-16\">\n<span class=\"lab\">Classification<\u002Fspan>\n<h2 class=\"title\">Orthogonal axes<\u002Fh2>\n<p>The first guard banned standalone 0–3 and a word list below Service — that mistakes spelling for meaning, since <strong style=\"color:var(--fs-ink-primary)\">\"2 reservations\"<\u002Fstrong> is ordinary product data and <em>service<\u002Fem> is ordinary English. The second fixed provenance but conflated three questions into one tag: <code>meta<\u002Fcode> was provenance, <code>text<\u002Fcode>/<code>datum<\u002Fcode> were presentation forms, <code>secret<\u002Fcode> was a disclosure policy. So <code>text<\u002Fcode> silently meant <em>no minimum<\u002Fem>, and prose could carry a Ledger fact past the guard while a harmless integer was blocked for looking like one.<\u002Fp>\n<p>Each axis is now declared independently. Classification describes what a fragment <em>is<\u002Fem>; policy decides separately whether it may exist, be disclosed, and be acted upon. <strong style=\"color:var(--fs-ink-primary)\">A datum may be secret, and prose may require Ledger.<\u002Fstrong><\u002Fp>\n<p>Declaration is also separated from selection. A pack lists its fragments once in a <code>catalogue<\u002Fcode>, with policy that cannot see the context; <code>select(ctx)<\u002Fcode> then returns declared <strong style=\"color:var(--fs-ink-primary)\">IDs<\u002Fstrong> or an explicit none. That is what makes the policy class non-vacuous — while branches built their own fragments inline, a minimum could be derived from the same <code>ctx.exposure<\u002Fcode> the branch was keyed on, so the guard could not fail by construction. Class B now forces every catalogued fragment through <code>dispose()<\u002Fcode> at every context with no selector involved.<\u002Fp>\n<p>Packs never receive a denial reason. <code>decide()<\u002Fcode> keeps the exact reason for the audit; a pack sees only a disposition — <code>render<\u002Fcode>, <code>fallback<\u002Fcode>, <code>omit<\u002Fcode>. When a fragment's existence may not be acknowledged, missing capability, insufficient exposure and true absence <strong style=\"color:var(--fs-ink-primary)\">all collapse to the same disposition<\u002Fstrong>, so a refusal cannot be differenced into an enumeration oracle. The collapse is the default inside one function, never a branch a pack opts into.<\u002Fp>\n<\u002Fdiv>\n<div class=\"g3\">\n<div class=\"panel\"><span class=\"tag\">kind<\u002Fspan><div class=\"sec\">What it is<\u002Fdiv><p style=\"font-size:var(--fs-size-xs)\"><code>prose<\u002Fcode> · <code>datum<\u002Fcode> · <code>action<\u002Fcode> · <code>label<\u002Fcode>. A presentation form only — it grants and withholds nothing on its own.<\u002Fp><\u002Fdiv>\n<div class=\"panel\"><span class=\"tag tag-doctrine\">provenance<\u002Fspan><div class=\"sec\">Where it came from<\u002Fdiv><p style=\"font-size:var(--fs-size-xs)\"><code>doctrine<\u002Fcode> · <code>domain<\u002Fcode>. Doctrine metadata is the ladder counting itself, and never renders below Service whatever its kind.<\u002Fp><\u002Fdiv>\n<div class=\"panel\"><span class=\"tag\">minExposure<\u002Fspan><div class=\"sec\">When it may be shown<\u002Fdiv><p style=\"font-size:var(--fs-size-xs)\">0–3, and a property of the <em>content<\u002Fem>, not of the branch that selected it — otherwise the check is unfalsifiable.<\u002Fp><\u002Fdiv>\n<div class=\"panel\"><span class=\"tag tag-sensitive\">existence<\u002Fspan><div class=\"sec\">When it may be admitted<\u002Fdiv><p style=\"font-size:var(--fs-size-xs)\"><code>public<\u002Fcode> may be acknowledged as withheld; <code>conditional<\u002Fcode> only at or above its <code>existenceAt<\u002Fcode> ceiling; <code>secret<\u002Fcode> is omitted whole and never acknowledged.<\u002Fp><\u002Fdiv>\n<div class=\"panel\"><span class=\"tag\">capability<\u002Fspan><div class=\"sec\">What you must hold<\u002Fdiv><p style=\"font-size:var(--fs-size-xs)\">Checked before exposure, because holding no grant is a harder no than standing too low — and must not be reported as an exposure problem.<\u002Fp><\u002Fdiv>\n<div class=\"panel\"><span class=\"tag\">fallback<\u002Fspan><div class=\"sec\">What shows instead<\u002Fdiv><p style=\"font-size:var(--fs-size-xs)\">Per field, per pack. A refusal degrades that one field to a safe line and fails conformance separately; it never blanks critical UI.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<p style=\"font-size:var(--fs-size-xs)\">Unclassified text is itself a violation: a pack returning a bare string gets its field-specific fallback and fails conformance. Lexical scanning survives only as <strong style=\"color:var(--fs-ink-primary)\">secondary lint<\u002Fstrong> — advisory, never part of a verdict, and with no digit rule.<\u002Fp>\n<\u002Fdiv>\n\n<div class=\"rule\"><\u002Fdiv>\n\n<div class=\"stack-16\">\n<span class=\"lab\">Fallbacks<\u002Fspan>\n<h2 class=\"title\">A violation never blanks the screen<\u002Fh2>\n<p>Required fields always render something coherent. When a projector fails — missing value, unclassified string, a fragment above the viewer's exposure — the field's own fallback renders and conformance fails separately. Optional fields omit silently, which is the designed behaviour rather than a fault.<\u002Fp>\n<div class=\"panel\" id=\"fallbacks\"><\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"rule\"><\u002Fdiv>\n\n<div class=\"stack-16\">\n<span class=\"lab\">Roster · disclosure surface<\u002Fspan>\n<h2 class=\"title\">What each role actually sees<\u002Fh2>\n<p>Rows, columns and affordances resolved per role at the console. Hidden records are <em>absent<\u002Fem>, not masked; aggregates are computed over the visible set only; export is a separate grant at every level.<\u002Fp>\n<table id=\"roster\"><thead><tr><th>Role<\u002Fth><th>Rows<\u002Fth><th>Columns<\u002Fth><th>Count label<\u002Fth><th>Row actions<\u002Fth><th>Export<\u002Fth><th>Hidden<\u002Fth><\u002Ftr><\u002Fthead><tbody><\u002Ftbody><\u002Ftable>\n<\u002Fdiv>\n\n<div class=\"stack-16\">\n<span class=\"lab\">Disclosure mode<\u002Fspan>\n<table id=\"matrix\"><thead><tr><th>Destination<\u002Fth><th>Guest<\u002Fth><th>Member<\u002Fth><th>Operator<\u002Fth><th>Principal<\u002Fth><\u002Ftr><\u002Fthead><tbody><\u002Ftbody><\u002Ftable>\n<p style=\"font-size:var(--fs-size-xs)\">At nominal state. <strong style=\"color:var(--fs-ink-primary)\">settlement<\u002Fstrong> is the only sensitive resource, with existence public from ceiling 2 — so guests and members get silence rather than a refusal that confirms it exists.<\u002Fp>\n<\u002Fdiv>\n\n<div class=\"rule\"><\u002Fdiv>\n\n<div class=\"stack-16\">\n<span class=\"lab\">Secondary lint<\u002Fspan>\n<h2 class=\"title\">Advisory only<\u002Fh2>\n<p>Doctrine vocabulary appearing inside a <code>text<\u002Fcode> fragment is a naming smell, not a disclosure failure — provenance already governs. Deliberately contains no digit rule.<\u002Fp>\n<div class=\"panel\" id=\"advisories\"><\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<script>\n(function(){\n  var D = window.FreesideDoctrine;\n  var el = function(id){ return document.getElementById(id); };\n  if (!D) { el('verdict').textContent = 'NO MODULE'; return; }\n  /* A throwing check must not blank the card. Without this the first statement\n     dies and every dynamic section below stays empty, which reads as \"nothing\n     ran\" instead of \"one check is broken\". */\n  var a;\n  try { a = D.audit(); }\n  catch (err) {\n    el('verdict').textContent = 'ERROR';\n    el('verdict').style.color = 'var(--fs-state-critical)';\n    el('scope').textContent = 'audit() threw';\n    el('checks').innerHTML = '<div class=\"check bad\"><s><\u002Fs><div class=\"stack-8\">' +\n      '<div class=\"sec\">The audit itself failed<\u002Fdiv>' +\n      '<p style=\"font-size:var(--fs-size-xs)\">A check threw before it could report. Fix this first — every verdict below is meaningless until it runs.<\u002Fp>' +\n      '<div class=\"fail\">' + String((err && err.stack) || err).replace(/<\u002Fg, '&lt;') + '<\u002Fdiv>' +\n      '<\u002Fdiv><span class=\"verdict\">Threw<\u002Fspan><\u002Fdiv>';\n    return;\n  }\n  el('verdict').textContent = a.pass ? 'PASS' : 'FAIL';\n  el('verdict').style.color = a.pass ? 'var(--fs-state-positive)' : 'var(--fs-state-critical)';\n  el('scope').textContent = a.results.length + ' checks · ' + a.cases + ' cases · ' + a.packs.length + ' packs';\n\n  el('checks').innerHTML = a.results.map(function(r){\n    return '<div class=\"check ' + (r.pass ? 'ok' : 'bad') + '\"><s><\u002Fs>' +\n      '<div class=\"stack-8\"><div class=\"sec\">' + r.title + '<\u002Fdiv>' +\n      '<p style=\"font-size:var(--fs-size-xs)\">' + r.why + '<\u002Fp>' +\n      (r.failures.length ? '<div class=\"fail\">' + r.failures.slice(0,8).map(function(f){return String(f).replace(/<\u002Fg,'&lt;');}).join('<br>') +\n        (r.failures.length > 8 ? '<br>… ' + (r.failures.length - 8) + ' more' : '') + '<\u002Fdiv>' : '') +\n      '<\u002Fdiv><span class=\"verdict\">' + (r.pass ? 'Pass' : r.failures.length + ' failing') + '<\u002Fspan><\u002Fdiv>';\n  }).join('');\n\n  el('fallbacks').innerHTML = D.packs['permission-gate']\n    ? '<table><thead><tr><th>Field<\u002Fth><th>Required<\u002Fth><th>Fallback<\u002Fth><\u002Ftr><\u002Fthead><tbody>' +\n      Object.keys(D.packs['permission-gate'].fields).map(function(f){\n        var s = D.packs['permission-gate'].fields[f];\n        var fb = typeof s.fallback === 'function' ? '(computed from role)' : (s.fallback == null ? '— omits' : '\"' + s.fallback + '\"');\n        return '<tr><td>' + f + '<\u002Ftd><td>' + (s.required ? 'yes' : 'no') + '<\u002Ftd><td style=\"white-space:normal\">' + fb + '<\u002Ftd><\u002Ftr>';\n      }).join('') + '<\u002Ftbody><\u002Ftable>'\n    : '';\n\n  var tb = document.querySelector('#roster tbody');\n  tb.innerHTML = Object.keys(D.CEILING).map(function(role){\n    var p = D.project('roster', D.resolve({role:role, destination:'console', systemState:'nominal'}));\n    var acts = p.rows.length ? p.rows[0].actions.map(function(x){return x.label;}).join(', ') : '—';\n    var hidden = D.rosterFixture.RECORDS.length - p.rows.length;\n    return '<tr><td>' + role + '<\u002Ftd><td>' + p.rows.length + '<\u002Ftd><td>' + p.columns.length + '<\u002Ftd><td>' +\n      (p.countLabel || '—') + '<\u002Ftd><td style=\"white-space:normal\">' + (acts || '—') + '<\u002Ftd><td>' +\n      (p.canExport ? 'granted' : 'no') + '<\u002Ftd><td>' + hidden + ' omitted<\u002Ftd><\u002Ftr>';\n  }).join('');\n\n  var mb = document.querySelector('#matrix tbody');\n  mb.innerHTML = Object.keys(D.DEPTH).map(function(dest){\n    return '<tr><td>' + dest + '<\u002Ftd>' + Object.keys(D.CEILING).map(function(role){\n      var m = D.disclosureMode(D.resolve({role:role, destination:dest, systemState:'nominal'}));\n      return '<td><span class=\"m m-' + m + '\">' + m + '<\u002Fspan><\u002Ftd>';\n    }).join('') + '<\u002Ftr>';\n  }).join('');\n\n  el('advisories').innerHTML = a.advisories.length\n    ? a.advisories.map(function(x){ return '<div style=\"font-size:var(--fs-size-xs);color:var(--fs-state-caution)\">' + String(x).replace(/<\u002Fg,'&lt;') + '<\u002Fdiv>'; }).join('')\n    : '<p style=\"font-size:var(--fs-size-xs);margin:0\">None. No doctrine vocabulary found inside domain fragments.<\u002Fp>';\n})();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
