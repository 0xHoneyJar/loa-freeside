    unlocks: [CR-301, CR-302]

# ─────────────────────────────────────────────────────────────────────────────
# Feature flags controlled by gates (CR-209A: recognition, public-preparation,
# and restricted-report/row flags are independent; restricted rows stay
# hard-disabled until G1B/G4B). Enabling any flag before every controlling
# gate is `pass` is rejected as premature.
# ─────────────────────────────────────────────────────────────────────────────
flags:
  - id: collection_recognition
    description: T0 collection question, candidate recognition, and support demand surface
    controlled_by_gates: [G0, G2A]
    tier: T0
    enabled: false
  - id: public_preparation
    description: T1 internal controlled-fixture collection identity/ownership fan-in
    controlled_by_gates: [G0, G1, G1A, G1B-1, G1B-2, G2A, G3-PUBLIC]
    tier: T1
    enabled: false
  - id: restricted_report
    description: T2 production Gate Leak report orders, restricted evidence, and artifacts
    controlled_by_gates: [G-1, G1B-3, G1B-4, G1B-5, G3, G4, G4A, G4B, G5]
    tier: T2
    enabled: false
  - id: restricted_identity_rows
    description: Identity-row projections within Gate Leak artifacts (hard-disabled until G1B/G4B per CR-209A)
    controlled_by_gates: [G1B-3, G1B-4, G1B-5, G4B]
    tier: T2
    enabled: false
  - id: production_resolver_enablement
    description: Production collection identity backfill authority for resolver enablement
    controlled_by_gates: [G2B]
    enabled: false
  - id: network_breadth_enablement
    description: Additional-network enablement (Robinhood Chain 4663, Solana preparation parity)
    controlled_by_gates: [G2B, G6]
    enabled: false
