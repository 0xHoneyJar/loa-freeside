  - id: C0
    title: External go/no-go
    source: "sprint.md §5 checkpoint table"
    serial_spine:
      - [CR-000]
  - id: C1
    title: Public envelope
    source: "sprint.md §5 checkpoint table"
    serial_spine:
      - [CR-007A]
      - [CR-009]
      - [CR-013]
      - [CR-011A]
    unlocks: [CR-001, CR-003, CR-004, CR-005, CR-105]
  - id: C2
    title: Public closure
    source: "sprint.md §5 checkpoint table"
    serial_spine:
      - [CR-011A]
      - [CR-012A]
      - [CR-201A, CR-201C]
      - [CR-202, CR-204A]
    unlocks: [CR-108, CR-203]
  - id: C3
    title: Restricted authority
    source: "sprint.md §5 checkpoint table"
    serial_spine:
      - [CR-000]
      - [CR-007B]
      - [CR-008, CR-016, CR-017]
      - [CR-011B]
      - [CR-012B]
    unlocks: [CR-010]
  - id: C4
