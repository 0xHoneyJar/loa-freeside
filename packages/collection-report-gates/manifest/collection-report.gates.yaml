    source: "sprint.md §5 checkpoint table"
    serial_spine:
      - [CR-013]
      - [CR-014]
      - [CR-015]
    unlocks: [CR-201B]
  - id: C5
    title: Restricted integration
    source: "sprint.md §5 checkpoint table (reordered to follow the DAG — literal placed CR-209A before its own dependency CR-201B)"
