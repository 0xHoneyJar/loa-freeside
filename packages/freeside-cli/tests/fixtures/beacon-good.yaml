schema_version: '3'
slug: good-api
publisher: 0xHoneyJar
mcp:
  shape: data
  paths:
  - remote-http
  remote:
    transport: streamable-http
    endpoint: ${MCP_REMOTE_ENDPOINT}
  auth:
    kind: api-key
    header: X-MCP-Key
    credentials_ref:
      type: railway-secret
      key: MCP_INVENTORY_UPSTREAM_KEY
  capabilities:
  - tools
  tools:
  - list_holder_inventory
  - get_token_balance
  - resolve_collection_metadata
  source_of_truth:
    type: database
  pricing:
    model: free
    description: "First-party tenant \u2014 free during initial rollout"
  publisher: 0xHoneyJar
is:
  one_liner: Read-side inventory aggregator for ERC721 + ERC1155 holdings across registered
    chains
  scope:
  - Resolve holder inventory for a given wallet across multiple chains
  - Aggregate ERC721 + ERC1155 balances with collection metadata
  - Surface candy/drug/badge balances via stable view contracts
is_not:
- Does NOT manage minting, burning, or transfer initiation
- Does NOT cache pricing data (those live in freeside-mint/freeside-storage)
- "Will NOT proxy chain RPC calls \u2014 uses freeside-sonar for indexed reads"
composes_with:
  bad-api:
    role: test sibling edge
    tag: BadPort@1.0.0+a1b2c3d4e5f6a7b8
    required: false
sealed_schemas:
