# Freeside Module Registry — L1 canonical source-of-truth
#
# Mirrors loa-constructs/registry.yaml shape. Each entry registers a
# building (a `*-api`) for the federation manifest at /federation.json.
#
# Naming: every building is `*-api` (ADR-008 §D-11, operator-ratified
# 2026-05-23). The slug is the building's canonical identity and LEADS the
# GitHub repo rename — so a slug may be `storage-api` while `git_url` still
# points at the not-yet-renamed `freeside-storage.git` (rename pending).
#
# Schema:
#   version: integer
#   modules:
#     <module-slug>:            # the building's `*-api` identity
#       git_url: string          # canonical source repo (REAL/fetchable today)
#       beacon_url: string       # where to fetch the module's beacon.json
#       visibility: enum         # public | unlisted | internal (per ADR-007 §D-8)
#       owner: string            # GitHub handle or org
#       added: ISO-8601 date
#       rename: enum             # done | pending  (GitHub repo rename status)
#
# Reference: decisions/007-loa-freeside-absorption.md §D-1 (L1 Module Registry)
#            decisions/008-freeside-as-factory.md §D-11 (`*-api` convention)
#
# VALIDATION (status 2026-05-23): `freeside-cli doctor` is a stub — nothing yet
# fetches/validates these beacons, recomputes composes_with tag hashes, or
# reconciles `rename: done` against actual GitHub repo existence (it should also
# assert git_url basename == slug when rename is done). That wiring is T2a.

version: 1

modules:
  # ─── Production substrate buildings ──────────────────────────────────────
  sonar-api:
    git_url: https://github.com/0xHoneyJar/sonar-api.git
    beacon_url: https://sonar.0xhoneyjar.xyz/.well-known/beacon.json
    visibility: public
    owner: 0xHoneyJar
    added: "2026-05-18"
    rename: done

  storage-api:
    git_url: https://github.com/0xHoneyJar/freeside-storage.git  # rename to storage-api.git pending
    beacon_url: https://storage.0xhoneyjar.xyz/.well-known/beacon.json
