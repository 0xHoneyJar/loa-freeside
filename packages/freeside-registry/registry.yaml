# Freeside Module Registry — L1 canonical source-of-truth
#
# 8 canonical cells per ADR-009 §D-2 (decisions/009-freeside-hexagonal-federation.md):
# sonar-api, storage-api, mint-api, activities-api, inventory-api, score-api,
# identity-api, mediums-api. Naming convention *-api ratified 2026-05-23 in
# grimoires/loa/specs/enhance-freeside-api-surface.md.
#
# Schema:
#   version: integer
#   modules:
#     <module-slug>:
#       git_url: string             # canonical source repo
#       beacon_url: string          # planned beacon serving endpoint (may 404 today)
#       deployment_url: string|~    # actual current runtime URL (Railway etc.) — null if not deployed
#       visibility: enum            # public | unlisted | internal (per ADR-007 §D-8)
#       owner: string               # GitHub handle or org
#       added: ISO-8601 date
#       runtime_state: enum         # deployed | scaffolded | not-built
#       notes: string               # free-form (deploy quirks, health-path mismatches, etc.)
#       service:                    # OPTIONAL — ADR-012 Phase 0 declared health contract
#         deployment_url: string    #   must equal the entry-level deployment_url (decode filter)
#         health_path: string       #   starts with /
#         expected_status: int      #   100–599
#         auth_class: enum          #   none | static-key
#         expected_body_marker: str #   optional substring guard vs wrong-app-answering
#         probed_at: ISO date       #   provenance: when the value was live-probed
#         probe_source: enum        #   adr-012-appendix | live-probe
#       expectations:               # OPTIONAL — cadence ledger (staleness-against-declared-cadence)
#         - ref: slug               #   identity = <cell-slug>/<ref>, unique per cell
#           probe_kind: enum        #   http | graphql-lag | event-max-age (gh-workflow NOT yet valid)
#           cadence: duration       #   e.g. 15m / 6h / 1d
#           owner: string
#           target/expect: per-kind # see packages/freeside-registry/src/registry.ts
#
# Reference: decisions/007-loa-freeside-absorption.md §D-1 (L1 Module Registry)
#            decisions/009-freeside-hexagonal-federation.md §D-2 (cells canonical list)
#
# Live-probe state (2026-06-19, via `freeside-cli doctor` + direct /health probes):
#   DEPLOYED (HTTP live): sonar-api (+ belt-gateway 200), score-api (302, live),
#                         storage-api, identity-api, inventory-api (401, auth-gated MCP),
#                         activities-api
#   SCAFFOLDED (404):     mint-api (routeless Express shell), ledger-api (not yet deployed)
#   NOT-BUILT runtime:    mediums-api (npm lib only), events-api (in-repo library)
#
# Subdomain *.0xhoneyjar.xyz beacon endpoints STILL 404 for ALL cells (re-verified
# 2026-06-19) — DNS not yet pointed at Railway URLs, and beacon-serving routes not yet
# implemented in cells. This is the federation-discovery gap (the awareness surface from
# grimoires/loa/specs/enhance-freeside-api-surface.md T1/T2 follow-up).
#
# ─── Cluster auth model (de-quirked 2026-06-03 via the cubquests dogfood) ──────────
# There is NO single cluster token. identity-api is the credential ROOT, but each cell
# gates differently — 3 real mechanisms + 1 ghost. A consumer needs TWO credentials
# (HS256 user-JWT for activities, static key for score); there is no uniform header.
#   A. activities-api ← HS256 Bearer minted by identity-api, verified OFFLINE by
#      recomputing HMAC with IDENTITY_API_JWT_SECRET — which MUST byte-equal identity's
#      JWT_SECRET (parity verified green 2026-06-03 via hash compare). Secret drift →
#      every activities request 401s `bad_signature`, silently, cluster-wide. Worth a CI
#      canary (identity mints → activities verifies → alarm on mismatch).
#   B. score-api ← STATIC API key (X-API-Key / Bearer: MIDI_API_KEY/HUB_API_KEY/API_KEY/
#      ADMIN_API_KEY). Service-to-service, no identity, no expiry — a leak is permanent.
#   C. sonar (belt-gateway) ← NONE (open GraphQL reads).
#   GHOST: identity /v1/auth/service-jwt mints ES256 svc-JWTs that NOTHING can verify
#      (/.well-known/jwks.json 404s; no ES256 verifier in any cell). Orphaned — build the
#      JWKS (one-function swap at activities jwt-verify.ts:22-27) or DELETE it. Do NOT
#      route service auth through it.
# Tracked (loa-freeside .beads · dogfood-followup) — these gaps are structured beads with
# closure conditions, not just this comment: arrakis-dogfood-{auth-secret-parity-canary,
# es256-svcjwt-ghost, registry-auth-field (the per-cell `auth:` schema bump),
# score-api-key-sprawl, identity-beacon-404, sonar-leaderboard-endpoint,
# freeside-ledger-missing}.

