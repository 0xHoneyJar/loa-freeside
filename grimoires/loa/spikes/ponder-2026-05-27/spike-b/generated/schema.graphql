"""
The `JSON` scalar type represents JSON values as specified by [ECMA-404](http://www.ecma-international.org/publications/files/ECMA-ST/ECMA-404.pdf).
"""
scalar JSON

scalar BigInt

type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

type ViewPageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
}

type Meta {
  status: JSON
}

type Query {
  validatorEvent(id: String!): validatorEvent
  validatorEvents(where: validatorEventFilter, orderBy: String, orderDirection: String, before: String, after: String, limit: Int, offset: Int): validatorEventPage!
  _meta: Meta
}

type validatorEvent {
  id: String!
  eventName: String!
  blockNumber: BigInt!
  validatorPubkey: String
  rawArgsJson: String!
}

type validatorEventPage {
  items: [validatorEvent!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

input validatorEventFilter {
  AND: [validatorEventFilter]
  OR: [validatorEventFilter]
  id: String
  id_not: String
  id_in: [String]
  id_not_in: [String]
  id_contains: String
  id_not_contains: String
  id_starts_with: String
