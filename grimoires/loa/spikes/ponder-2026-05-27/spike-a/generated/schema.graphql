"""
The `JSON` scalar type represents JSON values as specified by [ECMA-404](http://www.ecma-international.org/publications/files/ECMA-ST/ECMA-404.pdf).
"""
scalar JSON

scalar BigInt

type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

type ViewPageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
}

type Meta {
  status: JSON
}

type Query {
  transferEvent(id: String!): transferEvent
  transferEvents(where: transferEventFilter, orderBy: String, orderDirection: String, before: String, after: String, limit: Int, offset: Int): transferEventPage!
  _meta: Meta
}

type transferEvent {
  id: String!
  contractName: String!
  contractAddress: String!
  blockNumber: BigInt!
  from: String!
  to: String!
  tokenId: BigInt!
}

type transferEventPage {
  items: [transferEvent!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

input transferEventFilter {
  AND: [transferEventFilter]
  OR: [transferEventFilter]
  id: String
  id_not: String
  id_in: [String]
  id_not_in: [String]
  id_contains: String
  id_not_contains: String
  id_starts_with: String
  id_ends_with: String
  id_not_starts_with: String
  id_not_ends_with: String
  id_contains_nocase: String
  id_not_contains_nocase: String
  id_starts_with_nocase: String
  id_ends_with_nocase: String
  id_not_starts_with_nocase: String
  id_not_ends_with_nocase: String
  contractName: String
  contractName_not: String
  contractName_in: [String]
  contractName_not_in: [String]
  contractName_contains: String
  contractName_not_contains: String
  contractName_starts_with: String
  contractName_ends_with: String
  contractName_not_starts_with: String
  contractName_not_ends_with: String
  contractName_contains_nocase: String
  contractName_not_contains_nocase: String
  contractName_starts_with_nocase: String
  contractName_ends_with_nocase: String
  contractName_not_starts_with_nocase: String
  contractName_not_ends_with_nocase: String
  contractAddress: String
  contractAddress_not: String
  contractAddress_in: [String]
  contractAddress_not_in: [String]
  contractAddress_contains: String
  contractAddress_not_contains: String
  contractAddress_starts_with: String
  contractAddress_ends_with: String
  contractAddress_not_starts_with: String
  contractAddress_not_ends_with: String
  blockNumber: BigInt
  blockNumber_not: BigInt
  blockNumber_in: [BigInt]
  blockNumber_not_in: [BigInt]
  blockNumber_gt: BigInt
  blockNumber_lt: BigInt
  blockNumber_gte: BigInt
  blockNumber_lte: BigInt
  from: String
  from_not: String
  from_in: [String]
  from_not_in: [String]
  from_contains: String
  from_not_contains: String
  from_starts_with: String
  from_ends_with: String
  from_not_starts_with: String
  from_not_ends_with: String
  to: String
  to_not: String
  to_in: [String]
  to_not_in: [String]
  to_contains: String
  to_not_contains: String
