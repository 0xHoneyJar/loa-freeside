# ordering-service — deploy from loa-freeside repo root (Railway project: ordering-service).
# Build context is the monorepo root; Dockerfile lives under packages/services/ordering/.
[build]
builder = "DOCKERFILE"
dockerfilePath = "packages/services/ordering/Dockerfile"

[deploy]
healthcheckPath = "/healthz"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
